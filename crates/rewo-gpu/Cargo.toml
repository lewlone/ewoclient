[package]
name = "rewo-gpu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ash = { workspace = true }
ash-window = { workspace = true }
gpu-allocator = { workspace = true }
raw-window-handle = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }
png = { workspace = true }
glam = { workspace = true }
# fdlibm-derived scalar math: `libm::sin` matches Java's `StrictMath.sin`
# (hence `(float)Math.sin`) bit-for-bit, which the platform libm on Windows
# does not — required for bit-exact star geometry vs the JOML oracle (M12).
libm = "0.2"
# M9 CEM: parse OptiFine .jem/.jpm entity models from resource packs.
serde = { workspace = true }
serde_json = { workspace = true }
# Order-preserving deserialize for the _animations.jpm assignment maps.
indexmap = { workspace = true }
# M52b Velvet text: variable-font rasterization. `render` is what provides
# `scale::Render` + `zeno::Format` (it pulls zeno/eval); `scale` alone gives
# only the outline sink. Kept explicit rather than defaulted so a future
# default-feature change cannot silently drop the rasterizer.
swash = { version = "0.2.10", default-features = false, features = ["scale", "render", "std"] }
