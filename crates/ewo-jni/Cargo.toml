[package]
name = "ewo-jni"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

# Phase E spike. A C dynamic library loaded into the Minecraft JVM by the
# `ewo-hud` Fabric mod — it borrows Minecraft's GL context and paints the
# `ewo-render` Skia UI over the framebuffer. See CLAUDE.md "Phase E".
#
# `rlib` rides alongside `cdylib` purely so `examples/hudshot.rs` can link the
# crate and render the overlay to a PNG offscreen — the in-game equivalent of
# `ewo-render`'s `dropdown_shot`. The JVM only ever loads the cdylib.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ewo-core.workspace = true
ewo-render.workspace = true
skia-safe.workspace = true
gl.workspace = true
# Raw JNI type definitions — used once, in `nativeInit`, to resolve a direct
# `ByteBuffer`'s address via `GetDirectBufferAddress`. Just bindings, no logic.
jni-sys = "0.3"

[features]
default = []
# Propagates to `ewo-core/pvp` so the shared REGISTRY (and therefore the
# overlay's MODULES tab + Rust-side module-state writer) extends to the
# assist set. The Java mod's `build.ps1 -Pvp` must be paired with this when
# producing a matched pvp build.
pvp = ["ewo-core/pvp"]

# Windows System Media Transport Controls — feeds the media-controller widget
# with "now playing" / thumbnail / transport state. Polled from a background
# thread (see `media.rs`).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Storage_Streams",
    # Audio capture for the media visualiser (see `audio.rs`) — WASAPI
    # process loopback, so the game's own sound doesn't drive the bars.
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # CreateEventW takes a SECURITY_ATTRIBUTES pointer, so it is gated behind
    # the Security feature even though we always pass null.
    "Win32_Security",
    # nativeForceExit — TerminateProcess for the mod's exit watchdog (the
    # JVM's native teardown can deadlock at DLL detach; see EwoHudMod).
    "Win32_System_Threading",
] }
# `#[implement]` expands to absolute `::windows_core::` paths, so the core
# crate has to be a direct dependency rather than reached through `windows`.
# Same 0.58 release, so cargo unifies it with the one `windows` already pulls.
windows-core = "0.58"
