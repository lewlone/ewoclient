[package]
name = "rewo-audio"
version = "0.1.0"
edition = "2021"

[dependencies]
# **Ogg and Vorbis only.** `default-features = false` drops the mp3/aac/flac/wav
# bundles symphonia enables by default; Minecraft ships `.ogg` and nothing else,
# so every other codec would be build time and attack surface for a format the
# game cannot contain.
#
# This is the crate's ONLY dependency, and deliberately not `rewo-net` or
# `rewo-data`: `rewo-net` must never gain a device or codec dependency, or 34
# gates link an audio stack to decode a packet. The store lookup that turns an
# asset key into bytes therefore lives on the caller's side of `PcmSource`.
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis"] }

# **The direction that is allowed.** rewo-audio may depend on rewo-net, for
# ListenerTransform and the OpenAL gain curve M131 transcribed; rewo-net must
# never depend on this, or 34 gates link a codec to decode a packet.
rewo-net = { path = "../rewo-net" }

# **The device, and the only dependency that can make a noise.** Reached from
# rewo-app only under its `audio` feature, which is off by default: a default
# build links no audio stack, so all 34 gates are unchanged. See
# `live_sink::LiveSink` and `rewo-app`'s `audio_backend`.
cpal = "0.15"

# M143 — `LiveSink` reports an unresolvable asset once per distinct key. A
# counter alone ("15 unresolved") cannot say WHICH sound is missing, and on a
# partial asset store that is the only question worth asking.
log = { workspace = true }
