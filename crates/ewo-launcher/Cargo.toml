[package]
name = "ewo-launcher"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ewolauncher"
path = "src/main.rs"

[dependencies]
ewo-core.workspace = true
ewo-render.workspace = true
winit.workspace = true
log.workspace = true
env_logger.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
dirs.workspace = true
rand.workspace = true

# v2 phase A — Microsoft auth chain.
ureq.workspace = true
tiny_http.workspace = true
base64.workspace = true
sha2.workspace = true
sha1.workspace = true
zip.workspace = true
flate2.workspace = true
tar.workspace = true
urlencoding.workspace = true
serde_json.workspace = true
# Runtime window icon — decodes the 256px PNG frame inside assets/icon.ico.
png.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

# Linux: refresh/social tokens live in the desktop's Secret Service (GNOME
# Keyring, KWallet, ...), the Linux counterpart of the Windows DPAPI sealing
# (`src/auth/keyring_cipher.rs`). `sync-secret-service` is the *blocking*
# D-Bus backend (libdbus, so the build needs libdbus-1-dev + pkg-config and
# the binary libdbus-1 at runtime); no async runtime is pulled in, which
# CLAUDE.md forbids. `crypto-rust` keeps OpenSSL out of the tree.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
# No platform backend: only the crate's in-memory mock store, so the keyring
# cipher's logic is unit-tested on every host (Windows included).
keyring = { version = "3.6", default-features = false }

# Embeds the Windows app icon (assets/icon.ico) into the .exe via build.rs.
# Only invoked when the .ico exists, so the build never depends on the art.
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

# Linux (Hyprland / wlroots Wayland) deps are added in step 1 when we wire
# the wayland.rs platform implementation. See CLAUDE.md.

[features]
default = []
# Propagates to `ewo-core/pvp` so the launcher's Settings → Modules tab +
# keybind registry expose the assist module set. Pair with `ewo-jni`'s `pvp`
# feature when producing a matched pvp build (cargo's feature unification
# does this automatically when you build the workspace with --features pvp).
pvp = ["ewo-core/pvp"]

[lints]
workspace = true
