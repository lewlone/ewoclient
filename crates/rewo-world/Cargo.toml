# fdlibm-derived scalar math: `libm::sin` matches Java's `(float)Math.sin`
# bit-for-bit for the `Mth` sine table (`lightmap`), the same discipline the
# M12 celestial star geometry relies on. The platform libm on Windows drifts a
# couple ULP.
libm = "0.2"
