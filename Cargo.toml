[workspace]
resolver = "2"
members = [
    "crates/ewo-core",
    "crates/ewo-render",
    "crates/ewo-ui",
    "crates/ewo-launcher",
    "crates/ewo-jni",
    "crates/rewo-gpu",
    "crates/rewo-app",
    "crates/rewo-proto",
    "crates/rewo-data",
    "crates/rewo-net",
    "crates/rewo-world",
    "crates/rewo-mesh",
    "crates/rewo-audio",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Valtteri Saarinen"]
license = "Proprietary"
repository = ""
rust-version = "1.80"

[workspace.dependencies]
# Window + input
winit = "0.30"

# Math
glam = "0.29"

# Layout
taffy = "0.7"

# Logging
log = "0.4"
env_logger = "0.11"

# CLI
clap = { version = "4", features = ["derive"] }

# Settings persistence
dirs = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Bytemuck for vertex data
bytemuck = { version = "1", features = ["derive"] }

# Particle PRNG (step 4+)
rand = "0.8"

# Software framebuffer for step 1 (replaced by Skia GL surface in step 2)
softbuffer = "0.4"

# Step 2 — Skia GL stack (+ d3d for the Windows DirectComposition backend)
skia-safe = { version = "0.78", features = ["gl", "textlayout", "d3d"] }
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
gl = "0.14"

# v2 phase A — Microsoft auth chain. All sync (no tokio per CLAUDE.md
# non-negotiables). `ureq` for HTTPS, `tiny_http` for the loopback redirect
# listener, `opener` to launch the system browser, `base64`/`sha2` for
# PKCE, `urlencoding` for query-string assembly.
ureq = { version = "2", features = ["json", "tls"] }
tiny_http = "0.12"
opener = "0.7"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
urlencoding = "2"
serde_json = "1"
# Order-preserving map — used by rewo-gpu's CEM animation parser so an
# `_animations.jpm` object's assignments keep file order (OptiFine evaluates
# them top-to-bottom; a later expression reads a bone channel an earlier one
# assigned). serde_json's default Map is a sorted BTreeMap, which would break
# FA's mirror/derive expressions (`l_eye.sy: "r_eye.sy"`).
indexmap = { version = "2", features = ["serde"] }

# v2 phase C — native extraction (unzip natives JARs into per-instance
# natives/). `zip` is sync; pure Rust; no compression-only deps we don't
# need (deflate/store cover Mojang's natives jars).
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"

# Rewo — the from-scratch native Minecraft client (see REWO_PLAN.md).
# ash = raw Vulkan 1.3; gpu-allocator = VMA-style suballocation;
# tracy-client = frame profiler; png = headless-verification screenshots;
# rayon = the mesh worker pool (REWO_PLAN §4 — meshing happens off the frame).
ash = "0.38"
rayon = "1"
ash-window = "0.13"
gpu-allocator = "0.28"
tracy-client = "0.18"
png = "0.18"
# Rewo M7 — online-mode login encryption (REWO_PLAN §12 M7): AES-128-CFB8
# stream cipher (hand-rolled CFB8 over the `aes` block core) + RSA-PKCS1v15
# for the key exchange. Sync like everything else.
aes = "0.8"
# `sha2` feature = the SHA-256 DigestInfo prefix for SHA256withRSA chat
# signing (M7b); also gives PKCS#1/PKCS#8 key parsing.
rsa = { version = "0.9", features = ["sha2"] }

# Internal
ewo-core = { path = "crates/ewo-core" }
ewo-render = { path = "crates/ewo-render" }
ewo-ui = { path = "crates/ewo-ui" }
rewo-gpu = { path = "crates/rewo-gpu" }
rewo-proto = { path = "crates/rewo-proto" }
rewo-data = { path = "crates/rewo-data" }
rewo-net = { path = "crates/rewo-net" }
rewo-world = { path = "crates/rewo-world" }
rewo-mesh = { path = "crates/rewo-mesh" }

# Platform: Windows
[workspace.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    # Windows DirectComposition backend (true per-pixel-alpha rounded corners):
    # Skia's D3D12 backend renders into a composition swapchain with
    # premultiplied alpha, presented through a DComp visual on a
    # WS_EX_NOREDIRECTIONBITMAP window. See `ewo-render/src/gl_backend.rs`.
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectComposition",
    # LEAK_HUNT_INSTRUMENT — these two enable `GetProcessMemoryInfo` in
    # `crates/ewo-launcher/src/window/win32.rs::process_memory`. Strip
    # them when the leak-hunt instrumentation is removed.
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    # Process enumeration for launch::reaper — reap a windowless zombie
    # java.exe holding an instance's natives dir locked before a relaunch.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
]

# NOTE: skia-safe is intentionally not declared here yet. It is added in step 2
# of the build sequence (see CLAUDE.md). First Skia build is slow (~20-40 min).
# When ready: skia-safe = { version = "0.78", features = ["gl", "textlayout"] }

[profile.dev]
opt-level = 1

# Skia is unusable at opt-level 0; bump the C++ side to 3 even in dev.
[profile.dev.package.skia-safe]
opt-level = 3
[profile.dev.package.skia-bindings]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
