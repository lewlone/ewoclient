// ——————————————————————————————————————————————————————————————
// Progress bar — 2px glass track, liquid-pearl fill with convection flow.
// Leading edge bloom leaks past geometric boundary. 100% celebratory pulse.
// Error states: 3 visual variants.
// ——————————————————————————————————————————————————————————————
function ProgressBar({ value, max = 100, state = 'normal', errorVariant = 'rose', celebrated = false }) {
  // state: 'normal' | 'complete' | 'error'
  const pct = Math.max(0, Math.min(100, (value / max) * 100));
  const trackRef = useRef(null);
  const [ringKey, setRingKey] = useState(0);
  const prevState = useRef(state);

  useEffect(() => {
    if (prevState.current !== 'complete' && state === 'complete') {
      setRingKey(k => k + 1);
    }
    prevState.current = state;
  }, [state]);

  return (
    <div className={`pbar pbar-state-${state} pbar-err-${errorVariant}`} ref={trackRef}>
      <div className="pbar-track" />
      <div className="pbar-fill" style={{ width: `${pct}%` }}>
        <div className="pbar-flow" aria-hidden />
        <div className="pbar-bloom" aria-hidden />
      </div>
      {state === 'error' && errorVariant === 'fracture' && (
        <div className="pbar-fracture" style={{ left: `${pct}%` }} aria-hidden />
      )}
      {state === 'error' && errorVariant === 'recede' && (
        <div className="pbar-err-shimmer" aria-hidden />
      )}
      {ringKey > 0 && state === 'complete' && (
        <span key={ringKey} className="pbar-ring" aria-hidden />
      )}
    </div>
  );
}

// ——————————————————————————————————————————————————————————————
// Slider — glass track, pearl orb handle with firefly halo, drag trail.
// ——————————————————————————————————————————————————————————————
function Slider({ value, min = 0, max = 100, step = 1, onChange, label, format }) {
  const [dragging, setDragging] = useState(false);
  const [trail, setTrail] = useState([]);
  const trackRef = useRef(null);
  const trailIdRef = useRef(0);

  const pct = ((value - min) / (max - min)) * 100;

  const setFromEvent = (clientX) => {
    const rect = trackRef.current.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
    const ratio = x / rect.width;
    let v = min + ratio * (max - min);
    if (step) v = Math.round(v / step) * step;
    v = Math.max(min, Math.min(max, v));
    onChange(v);
    const id = ++trailIdRef.current;
    setTrail(t => [...t.slice(-6), { id, pct: ratio * 100 }]);
    setTimeout(() => setTrail(t => t.filter(p => p.id !== id)), 500);
  };

  const onDown = (e) => {
    setDragging(true);
    setFromEvent(e.clientX);
    const move = (ev) => setFromEvent(ev.clientX);
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <div className="vslider">
      {label && <span className="vslider-label">{label}</span>}
      <div className={`vslider-row ${dragging ? 'dragging' : ''}`}>
        <div className="vslider-track" ref={trackRef} onPointerDown={onDown}>
          <div className="vslider-fill" style={{ width: `${pct}%` }}>
            <div className="pbar-flow" aria-hidden />
          </div>
          {trail.map(t => (
            <span key={t.id} className="vslider-trail" style={{ left: `${t.pct}%` }} aria-hidden />
          ))}
          <div className="vslider-handle" style={{ left: `${pct}%` }}>
            <div className="vslider-halo" aria-hidden />
            <div className="vslider-core" aria-hidden />
          </div>
          {dragging && (
            <div className="vslider-value" style={{ left: `${pct}%` }}>
              {format ? format(value) : (typeof value === 'number' ? value.toFixed(step < 1 ? 2 : 0) : value)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ——————————————————————————————————————————————————————————————
// Dropdown — header looks like a button. Menu portals to <body> at a
// fixed position so it can never be clipped by an ancestor with
// overflow: hidden (e.g. a Panel). Flips upward when low on space.
// ——————————————————————————————————————————————————————————————
function Dropdown({ value, options, onChange, label }) {
  const [open, setOpen] = useState(false);
  const [menuPos, setMenuPos] = useState(null); // {left, top, width, flipUp}
  const rootRef = useRef(null);
  const headRef = useRef(null);

  const recompute = () => {
    const head = headRef.current;
    if (!head) return;
    const r = head.getBoundingClientRect();
    const rowH = 44;
    const pad = 16;
    const want = options.length * rowH + pad;
    const spaceBelow = window.innerHeight - r.bottom - 16;
    const flipUp = spaceBelow < want && r.top > spaceBelow;
    setMenuPos({
      left: r.left,
      top: flipUp ? r.top - 8 : r.bottom + 8,
      width: r.width,
      flipUp,
    });
  };

  useEffect(() => {
    const close = (e) => {
      if (rootRef.current && rootRef.current.contains(e.target)) return;
      // Also keep open if clicking the portaled menu itself.
      const menu = document.querySelector('.vdrop-portal-menu[data-open="1"]');
      if (menu && menu.contains(e.target)) return;
      setOpen(false);
    };
    window.addEventListener('pointerdown', close);
    return () => window.removeEventListener('pointerdown', close);
  }, []);

  useEffect(() => {
    if (!open) return;
    recompute();
    const onScroll = () => recompute();
    const onResize = () => recompute();
    window.addEventListener('scroll', onScroll, true);
    window.addEventListener('resize', onResize);
    return () => {
      window.removeEventListener('scroll', onScroll, true);
      window.removeEventListener('resize', onResize);
    };
  }, [open]);

  const menu = open && menuPos ? ReactDOM.createPortal(
    <div
      className={`vdrop-portal-menu ${menuPos.flipUp ? 'flip-up' : ''}`}
      data-open="1"
      style={{
        position: 'fixed',
        left: menuPos.left,
        top: menuPos.top,
        width: menuPos.width,
        transform: menuPos.flipUp ? 'translateY(-100%)' : 'none',
        zIndex: 9999,
      }}
    >
      <div className="vdrop-panel-solid">
        {options.map((opt, i) => (
          <button
            key={opt}
            className={`vdrop-row ${opt === value ? 'selected' : ''}`}
            style={{ '--row-i': i }}
            onClick={() => { onChange(opt); setOpen(false); }}
            type="button"
          >
            <span className="vdrop-dot" aria-hidden />
            <BreathingText hoverGlow>{opt}</BreathingText>
          </button>
        ))}
      </div>
    </div>,
    document.body
  ) : null;

  return (
    <div className={`vdrop ${open ? 'open' : ''}`} ref={rootRef}>
      {label && <span className="vdrop-label">{label}</span>}
      <button
        ref={headRef}
        className="vdrop-head vbtn"
        onClick={() => setOpen(o => !o)}
        type="button"
      >
        <span className="vbtn-tint" aria-hidden />
        <span className="vbtn-sheen" aria-hidden />
        <span className="vbtn-rim" aria-hidden />
        <span className="vbtn-label"><BreathingText>{value}</BreathingText></span>
        <span className="vdrop-caret" aria-hidden />
      </button>
      {menu}
    </div>
  );
}

// ——————————————————————————————————————————————————————————————
// Status line — theater-marquee swap on change.
// ——————————————————————————————————————————————————————————————
function StatusLine({ children, tone = 'muted' }) {
  const [current, setCurrent] = useState(children);
  const [outgoing, setOutgoing] = useState(null);

  useEffect(() => {
    if (children !== current) {
      setOutgoing(current);
      setCurrent(children);
      const t = setTimeout(() => setOutgoing(null), 600);
      return () => clearTimeout(t);
    }
  }, [children, current]);

  return (
    <div className={`vstatus vstatus-tone-${tone}`}>
      {outgoing != null && (
        <div className="vstatus-layer vstatus-out" key={`out-${outgoing}`}>
          <BreathingText>{outgoing}</BreathingText>
        </div>
      )}
      <div className="vstatus-layer vstatus-in" key={`in-${current}`}>
        <BreathingText>{current}</BreathingText>
      </div>
    </div>
  );
}

Object.assign(window, {
  Panel, Button, BreathingText, ProgressBar, Slider, Dropdown, StatusLine,
});

  { t: 0,    lvl: 'info',  src: 'launcher',  msg: 'Resolving instance · Velvet Hours' },

  { t: 2240, lvl: 'info',  src: 'mc',        msg: 'Reaching title screen…' },
  { t: 2400, lvl: 'ok',    src: 'mc',        msg: 'Title screen presented · handing off' },
];

const PROGRESS_KEYFRAMES = [
  { t: 0,    p: 0,   stage: 'preparing' },
  { t: 200,  p: 6,   stage: 'preparing' },
  { t: 600,  p: 28,  stage: 'verifying assets' },
  { t: 1100, p: 52,  stage: 'loading mods' },
  { t: 1400, p: 68,  stage: 'spawning JVM' },
  { t: 1800, p: 84,  stage: 'starting engine' },
  { t: 2200, p: 96,  stage: 'reaching title' },
  { t: 2400, p: 100, stage: 'ready' },
];

function progressAt(t) {
  let prev = PROGRESS_KEYFRAMES[0];
  for (const k of PROGRESS_KEYFRAMES) {
    if (t < k.t) {
      const frac = (t - prev.t) / (k.t - prev.t);
      return { p: prev.p + (k.p - prev.p) * frac, stage: prev.stage };
    }
    prev = k;
  }
  return { p: 100, stage: 'ready' };
}

function Launching({ instance, onCancel, onDone, onError }) {
  const [t, setT] = useState2(0);
  const [logs, setLogs] = useState2([]);
  const [done, setDone] = useState2(false);
  const startRef = useRef2(null);
  const timerRef = useRef2(null);
  const logIdxRef = useRef2(0);
  const logRef = useRef2(null);
  const DURATION = 8000; // 8s — long enough to read the logs streaming
  const SCRIPT_DURATION = LOG_SCRIPT[LOG_SCRIPT.length - 1].t;
  const PROGRESS_DURATION = PROGRESS_KEYFRAMES[PROGRESS_KEYFRAMES.length - 1].t;

  useEffect2(() => {
    startRef.current = performance.now();
    timerRef.current = setInterval(() => {
      const elapsed = performance.now() - startRef.current;
      setT(elapsed);

      // Drain log script — scaled to fit our duration
      const scaledElapsed = (elapsed / DURATION) * SCRIPT_DURATION;
      while (logIdxRef.current < LOG_SCRIPT.length && LOG_SCRIPT[logIdxRef.current].t <= scaledElapsed) {
        const entry = LOG_SCRIPT[logIdxRef.current];
        setLogs(L => [...L, { ...entry, key: logIdxRef.current }]);
        logIdxRef.current += 1;
      }

      if (elapsed >= DURATION) {
        clearInterval(timerRef.current);
        setDone(true);
        setTimeout(() => onDone && onDone(), 1500);
      }
    }, 50);

    return () => {
      if (timerRef.current) clearInterval(timerRef.current);
    };
  }, []);

  // Auto-scroll logs
  useEffect2(() => {
    if (logRef.current) {
      logRef.current.scrollTop = logRef.current.scrollHeight;
    }
  }, [logs.length]);

  const { p, stage } = progressAt((t / DURATION) * PROGRESS_DURATION);

  return (
    <div className="screen-launching">
      <header className="screen-head screen-head-launching">
        <div className="launching-instance">
          <div className="launching-eyebrow">Launching</div>
          <h2 className="launching-name">
            <BreathingText sheen>{instance.name}</BreathingText>
          </h2>
          <div className="launching-meta">
            <span>{instance.version}</span>
            <span className="dot-sep" aria-hidden />
            <span>{instance.loader}</span>
          </div>
        </div>

        <div className="launching-percent">
          <span className="launching-percent-num">{Math.round(p)}</span>
          <span className="launching-percent-pct">%</span>
        </div>
      </header>

      <div className="launching-progress-region">
        <div className="launching-stage">
          <BreathingText>{done ? 'Ready · handing off to the game' : stage}</BreathingText>
        </div>
        <ProgressBar value={p} state={done ? 'complete' : 'normal'} />
      </div>

      <Panel breathing className="launching-log-panel" style={{ padding: '20px 24px' }}>
        <div className="launching-log-head">
          <span className="launching-log-title">Log · stdout</span>
          <span className="launching-log-count">{logs.length} entries</span>
        </div>
        <ol className="launching-log" ref={logRef}>
          {logs.map(l => (
            <li key={l.key} className={`log-line log-${l.lvl}`}>
              <span className="log-time">{(l.t / 1000).toFixed(2)}s</span>
              <span className="log-src">[{l.src}]</span>
              <span className="log-msg">{l.msg}</span>
            </li>
          ))}
        </ol>
      </Panel>

      <footer className="launching-footer">
        {!done && (
          <button className="launching-cancel" onClick={onCancel}>
            <BreathingText hoverGlow>Cancel launch</BreathingText>
          </button>
        )}
        {done && (
          <div className="launching-handoff">
            <BreathingText sheen>The curtain rises.</BreathingText>
          </div>
        )}
      </footer>
    </div>
  );
}

<script type="text/babel">// EwoClient Launcher — multi-screen prototype: Main menu → Instances → Launching.

const { useEffect, useRef, useState } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": 1,
  "motionSpeed": 1,
  "breathAmp": 1,
  "warmth": 0.6,
  "bokehTint": 0,
  "fontPair": "Fraunces + Newsreader",
  "startScreen": "menu"
}/*EDITMODE-END*/;

const FONT_PAIRS = {
  'Fraunces + Newsreader': { display: 'Fraunces', body: 'Newsreader' },
  'Playfair + Cormorant':  { display: 'Playfair Display', body: 'Cormorant Garamond' },
};

const SCREENS = [
  { id: 'menu',       label: 'Main menu' },
  { id: 'instances',  label: 'Instances' },
  { id: 'settings',   label: 'Settings'  },
  { id: 'launching',  label: 'Launching' },
];

const NEW_INSTANCE_NAMES = [
  'Quiet Atrium', 'Glass Garden', 'Lacquer Hall', 'Slow Theatre',
  'Pearl Antechamber', 'Iris Hollow', 'Cloth Foundry', 'Velvet Annex'
];

function makeNewInstance() {
  const name = NEW_INSTANCE_NAMES[Math.floor(Math.random() * NEW_INSTANCE_NAMES.length)];
  return {
    id: `inst-${Date.now()}`,
    name,
    version: '1.21.1',
    loader: 'Vanilla',
    last: 'never',
    ram: 4,
    mods: [],
  };
}

function App() {
  const [screen, setScreen] = useState('menu');
  const [instances, setInstances] = useState(() => window.INSTANCES || []);
  const [selectedInstance, setSelectedInstance] = useState(
    (window.INSTANCES && window.INSTANCES[0]) ? window.INSTANCES[0].id : null
  );
  const [launchingInstance, setLaunchingInstance] = useState(null);
  const [celebrate, setCelebrate] = useState(false);
  const [disturbKey, setDisturbKey] = useState(0);
  const [quitting, setQuitting] = useState(false);
  const [showNewModal, setShowNewModal] = useState(false);

  const [tweaks, setTweak] = window.useTweaks
    ? window.useTweaks(TWEAK_DEFAULTS)
    : (() => {
        const [v, sv] = useState(TWEAK_DEFAULTS);
        return [v, (k, val) => sv(p => ({ ...p, [k]: val }))];
      })();
  const t = tweaks;

  useEffect(() => {
    const fonts = FONT_PAIRS[t.fontPair] || FONT_PAIRS['Fraunces + Newsreader'];
    document.documentElement.style.setProperty('--display-font', `'${fonts.display}', serif`);
    document.documentElement.style.setProperty('--body-font', `'${fonts.body}', serif`);
  }, [t.fontPair]);

  // Honor startScreen tweak on first mount
  useEffect(() => { if (t.startScreen && t.startScreen !== screen) setScreen(t.startScreen); }, [t.startScreen]);

  const onDisturb = () => setDisturbKey(k => k + 1);

  const handleNav = (where) => {
    if (where === 'instances') setScreen('instances');
    else if (where === 'settings') setScreen('settings');
    else if (where === 'about') setScreen('settings');
  };

  const handleAddInstance = () => {
    setShowNewModal(true);
  };

  const handleCreateInstance = (data) => {
    const inst = {
      id: `inst-${Date.now()}`,
      name: data.name,
      version: data.version,
      loader: data.loader,
      last: 'never',
      ram: data.ram,
      mods: [],
    };
    setInstances(prev => [inst, ...prev]);
    setSelectedInstance(inst.id);
    setShowNewModal(false);
    if (screen !== 'instances') setScreen('instances');
  };

  const handleUpdateInstance = (id, patch) => {
    setInstances(prev => prev.map(i => i.id === id ? { ...i, ...patch } : i));
  };

  const handleDeleteInstance = (id) => {
    setInstances(prev => {
      const next = prev.filter(i => i.id !== id);
      if (id === selectedInstance) {
        setSelectedInstance(next.length ? next[0].id : null);
      }
      return next;
    });
  };

  const handleQuit = () => {
    setQuitting(true);
    setTimeout(() => setQuitting(false), 1200);
  };

  const handleLaunch = (inst) => {
    setLaunchingInstance(inst);
    setScreen('launching');
  };

  const handleLaunchDone = () => {
    setCelebrate(true);
    setTimeout(() => setCelebrate(false), 1500);
    setTimeout(() => setScreen('menu'), 1800);
  };

  return (
    <div className="app-viewport">
      <div className={`app-window ${celebrate ? 'celebrating' : ''} ${quitting ? 'quitting' : ''}`}
           style={{
             '--motion-speed': t.motionSpeed,
             '--breath-amp': t.breathAmp,
             '--density': t.density,
             '--warmth': t.warmth,
           }}
      >
        <Backdrop
          density={t.density}
          speed={t.motionSpeed}
          warmth={t.warmth}
          bokehTint={t.bokehTint}
          celebrate={celebrate}
          onDisturb={onDisturb}
          disturbKey={disturbKey}
        />

        <div className="screen-stage" key={screen}>
          {screen === 'menu' && (
            <MainMenu
              onNav={handleNav}
              onQuit={handleQuit}
              lastInstance={selectedInstance ? (instances.find(i => i.id === selectedInstance) || {}).name : null}
            />
          )}
          {screen === 'instances' && (
            <Instances
              instances={instances}
              onBack={() => setScreen('menu')}
              onLaunch={handleLaunch}
              selectedId={selectedInstance}
              onSelect={setSelectedInstance}
              onAdd={handleAddInstance}
              onDelete={handleDeleteInstance}
              onUpdate={handleUpdateInstance}
            />
          )}
          {screen === 'settings' && (
            <Settings onBack={() => setScreen('menu')} />
          )}
          {screen === 'launching' && launchingInstance && (
            <Launching
              instance={launchingInstance}
              onCancel={() => setScreen('instances')}
              onDone={handleLaunchDone}
            />
          )}
        </div>

        <NewInstanceModal
          open={showNewModal}
          onCancel={() => setShowNewModal(false)}
          onCreate={handleCreateInstance}
        />

        {/* Screen picker (dev) */}
        <div className="state-picker">
          {SCREENS.map(s => (
            <button key={s.id}
              className={screen === s.id ? 'active' : ''}
              onClick={() => {
                if (s.id === 'launching') {
                  const inst = instances.find(i => i.id === selectedInstance) || instances[0];
                  if (!inst) return;
                  setLaunchingInstance(inst);
                }
                setScreen(s.id);
              }}>
              {s.label}
            </button>
          ))}
        </div>

        {quitting && (
          <div className="quit-overlay">
            <div className="quit-line">
              <BreathingText sheen>… closing the curtain.</BreathingText>
            </div>
          </div>
        )}

        <div className="kbd-hint">click backdrop to disturb rose-dust</div>
      </div>

      {window.TweaksPanel && (
        <window.TweaksPanel>
          <window.TweakSection label="Screen" />
          <window.TweakSelect label="Start screen"
            value={SCREENS.find(s => s.id === t.startScreen)?.label || 'Main menu'}
            options={SCREENS.map(s => s.label)}
            onChange={v => setTweak('startScreen', SCREENS.find(s => s.label === v).id)} />

          <window.TweakSection label="Ambient" />
          <window.TweakSlider label="Dust density" value={t.density}
            min={0.2} max={2} step={0.1}
            onChange={v => setTweak('density', v)} />
          <window.TweakSlider label="Motion speed" value={t.motionSpeed}
            min={0.3} max={1.8} step={0.05}
            onChange={v => setTweak('motionSpeed', v)} />
          <window.TweakSlider label="Breathing" value={t.breathAmp}
            min={0} max={3} step={0.1}
            onChange={v => setTweak('breathAmp', v)} />

          <window.TweakSection label="Color" />
          <window.TweakSlider label="Warmth" value={t.warmth}
            min={0} max={1} step={0.05}
            onChange={v => setTweak('warmth', v)} />
          <window.TweakSelect label="Bokeh tint"
            value={['Pearl-pink', 'Champagne', 'Lavender', 'Opal'][t.bokehTint]}
            options={['Pearl-pink', 'Champagne', 'Lavender', 'Opal']}
            onChange={v => setTweak('bokehTint', ['Pearl-pink', 'Champagne', 'Lavender', 'Opal'].indexOf(v))} />

          <window.TweakSection label="Type" />
          <window.TweakSelect label="Font pairing"
            value={t.fontPair}
            options={Object.keys(FONT_PAIRS)}
            onChange={v => setTweak('fontPair', v)} />
        </window.TweaksPanel>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(<App />);
</script>
