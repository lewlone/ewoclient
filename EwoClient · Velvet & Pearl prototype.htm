:root {
  /* Core palette — tuned in oklch for consistent luminance. */
  --bg-core:        #000000;       /* OLED true-black */
  --bg-wine-a:      #0A0006;
  --bg-wine-b:      #120010;
  --panel-glass:    rgba(180, 130, 160, 0.06);
  --text-pearl:     #F4E8EA;
  --text-mauve:     #9A8087;
  --accent-berry:   #B47491;
  --accent-rose:    #E5B8C5;
  --accent-lav:     #C9A5D4;
  --accent-champ:   #E8D4A8;
  --accent-ember:   #C96A7A;   /* error — rose-red within the same family */

  /* Motion */
  --silk: cubic-bezier(0.22, 1, 0.36, 1);

  /* User-tweakable */
  --motion-speed: 1;
  --breath-amp: 1;
  --density: 1;
  --warmth: 0.6;
  --accent-hue-shift: 0deg;
}

* { box-sizing: border-box; }

/* Pearl-thread scrollbars — apply globally so they win over any host UA defaults. */
*::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
*::-webkit-scrollbar-track {
  background: transparent;
}
*::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, rgba(229, 184, 197, 0.32), rgba(180, 116, 145, 0.28));
  border-radius: 999px;
  border: 2px solid transparent;
  background-clip: padding-box;
  min-height: 36px;
}
*::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, rgba(229, 184, 197, 0.55), rgba(201, 165, 212, 0.5));
  background-clip: padding-box;
  border: 2px solid transparent;
}
*::-webkit-scrollbar-corner { background: transparent; }
*::-webkit-scrollbar-button { display: none; height: 0; width: 0; }
html { scrollbar-width: thin; scrollbar-color: rgba(229, 184, 197, 0.35) transparent; }
* { scrollbar-width: thin; scrollbar-color: rgba(229, 184, 197, 0.35) transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg-core);
  color: var(--text-pearl);
  font-family: 'Newsreader', 'Fraunces', serif;
  font-optical-sizing: auto;
  overflow: hidden;
  height: 100%;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

/* ═══════════════════════════════════════════════════════════════
   APP SHELL — frameless rounded-rect window with thin pearl rim
   ═══════════════════════════════════════════════════════════════ */

.app-viewport {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(ellipse at 50% 55%, #06000A 0%, #000000 70%);
  padding: 28px;
}

.app-window {
  position: relative;
  width: min(1180px, 100%);
  height: min(720px, 100%);
  border-radius: 22px;
  overflow: hidden;
  background: var(--bg-core);
  isolation: isolate;
  box-shadow:
    0 40px 120px -20px rgba(180, 100, 140, 0.35),
    0 12px 40px -8px rgba(0, 0, 0, 0.8),
    inset 0 0 0 1px rgba(229, 184, 197, 0.08);
}

/* Window rim glow. The previous spinning conic-gradient rim was visible
   as diagonal pearl streaks crossing the interior — the mask trick that
   was supposed to clip it to a 1.2px ring leaks the gradient's seam line
   into the content area, especially along the conic's start/end angle.
   Replaced with a static inset hairline. The pearl identity already lives
   on each glass panel's rim cycle (.glass-rim-*), so the window border
   doesn't need to compete. */
.app-window::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  box-shadow: inset 0 0 0 1px rgba(229, 184, 197, 0.16);
  pointer-events: none;
  z-index: 10;
}

.app-window::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  box-shadow: inset 0 0 80px -20px rgba(180, 100, 140, 0.15);
  pointer-events: none;
  z-index: 11;
}

/* ═══════════════════════════════════════════════════════════════
   BACKDROP — velvet folds + caustics + bokeh + petals + dust
   ═══════════════════════════════════════════════════════════════ */

.backdrop {
  position: absolute; inset: 0;
  overflow: hidden;
  /* isolation forms a new stacking context so the mix-blend-mode children
     (velvet folds, caustics, bokeh, pearl dust) are confined here and don't
     leak across into the panel layer above. Without this, screen-blend
     children blend with everything beneath them in the parent's stacking
     context — including, in some browsers, content that visually sits on
     top of the backdrop. */
  isolation: isolate;
  background:
    radial-gradient(ellipse at 35% 40%, var(--bg-wine-b) 0%, var(--bg-wine-a) 45%, #000 80%);
  z-index: 0;
}

/* Velvet folds */
.vf-root { position: absolute; inset: 0; }
.vf-turb { position: absolute; width: 0; height: 0; }
.vf-layer {
  position: absolute; inset: -20%;
  filter: blur(40px) url(#vfTurb);
  animation: fold-drift 22s ease-in-out infinite alternate;
  mix-blend-mode: screen;
  opacity: 0.85;
}
.vf-b { animation-delay: -8s; animation-duration: 28s; }
.vf-c { animation-delay: -14s; animation-duration: 34s; opacity: 0.6; }

@keyframes fold-drift {
  0%   { transform: translate(-3%, -2%) scale(1.08) rotate(-1deg); }
  50%  { transform: translate(2%, 3%) scale(1.12) rotate(0.5deg); }
  100% { transform: translate(-2%, -3%) scale(1.06) rotate(-0.5deg); }
}

.vf-vignette {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 50% 60%, transparent 30%, rgba(0,0,0,0.65) 85%);
  pointer-events: none;
}

/* Caustics — slow iridescent light-on-silk */
.caustics {
  position: absolute; inset: 0;
  mix-blend-mode: screen;
  pointer-events: none;
}
.caustics-layer {
  position: absolute; inset: -20%;
  background:
    radial-gradient(40% 30% at 20% 30%, oklch(0.85 0.06 340 / 0.12), transparent 60%),
    radial-gradient(30% 40% at 70% 60%, oklch(0.82 0.08 300 / 0.1), transparent 60%),
    radial-gradient(35% 35% at 50% 80%, oklch(0.88 0.05 45 / 0.08), transparent 60%);
  filter: blur(30px);
  animation: caustic-drift 38s linear infinite;
}
.caustics-layer-b {
  background:
    radial-gradient(35% 40% at 80% 20%, oklch(0.84 0.07 320 / 0.1), transparent 60%),
    radial-gradient(40% 30% at 30% 70%, oklch(0.86 0.06 25 / 0.08), transparent 60%);
  animation-duration: 52s;
  animation-direction: reverse;
}
@keyframes caustic-drift {
  to { transform: translate(3%, -4%) rotate(6deg); }
}

/* Bokeh orb — softer + smaller so the per-frame blur cost is bearable.
   60px blur on an 80vmin element was the single biggest CSS perf hog;
   the orb still reads as a massive soft pearl at 50vmin / blur(40px) but
   now the GPU can keep up at full framerate. */
.bokeh-orb {
  position: absolute;
  width: 50vmin; height: 50vmin;
  top: 30%; left: -25%;
  border-radius: 50%;
  filter: blur(40px);
  opacity: 0.4;
  mix-blend-mode: screen;
  animation: bokeh-cross 60s linear infinite;
  pointer-events: none;
}
@keyframes bokeh-cross {
  0%   { transform: translate(-20%, -10%) scale(1); opacity: 0; }
  15%  { opacity: 0.35; }
  50%  { transform: translate(60%, 20%) scale(1.2); opacity: 0.45; }
  85%  { opacity: 0.3; }
  100% { transform: translate(140%, -5%) scale(0.9); opacity: 0; }
}

/* Pearl dust canvas */
.pearl-dust {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  mix-blend-mode: screen;
}

/* Petals canvas */
.petals {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

/* Celebrate brightness lift */
.app-window.celebrating .backdrop {
  filter: brightness(1.15) saturate(1.08);
  transition: filter 400ms cubic-bezier(0.22, 1, 0.36, 1);
}
.app-window:not(.celebrating) .backdrop {
  transition: filter 800ms cubic-bezier(0.22, 1, 0.36, 1);
}

/* ═══════════════════════════════════════════════════════════════
   GLASS PANEL
   ═══════════════════════════════════════════════════════════════ */

.glass-panel {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  isolation: isolate;
  opacity: 1;
  /* Hairline rim drawn on the panel itself so the rounded corner is honored
     by the same element that sets border-radius. Inner layers no longer
     paint a rim — that produced visible square offsets at the corners. */
  box-shadow: inset 0 0 0 0.5px rgba(229, 184, 197, 0.18);
}
.glass-panel.mounted { opacity: 1; }

.glass-refract {
  position: absolute; inset: 0;
  border-radius: inherit;
  /* Blur 32px (was bumped 28→40 to mask z-order leaks; 40 was costly enough
     across multiple panels to drag framerate down). With backdrop isolation
     now handling the leak properly, 32 + the higher tint opacity is enough
     to obscure backdrop content without paying for the full 40. */
  backdrop-filter: blur(32px) saturate(1.45);
  -webkit-backdrop-filter: blur(32px) saturate(1.45);
  background: rgba(28, 10, 20, 0.52);
  z-index: 0;
}

.glass-tint {
  position: absolute; inset: 0;
  border-radius: inherit;
  /* Tint alphas bumped (~2x). The original 0.05–0.09 range left the panel
     too transparent — backdrop content was readable through it. Higher tint
     keeps the pearlescent character but commits the panel as foreground. */
  background:
    linear-gradient(135deg,
      rgba(229, 184, 197, 0.18) 0%,
      rgba(180, 116, 145, 0.12) 40%,
      rgba(201, 165, 212, 0.16) 100%),
    radial-gradient(120% 80% at 50% -20%, rgba(244, 232, 234, 0.14), transparent 60%);
  z-index: 1;
  pointer-events: none;
}

.glass-panel.breathing {
  /* Breath is delegated to the .glass-tint layer (no text content there)
     so we never sub-pixel-scale the panel itself. Scaling the panel forces
     subpixel-misaligned rasterization of every glyph it contains, which
     visibly softens text on dense surfaces like the launching log. */
}
.glass-panel.breathing > .glass-tint {
  animation: breath-tint calc(8s / var(--motion-speed)) ease-in-out infinite;
}
.glass-panel.mount-in {
  animation: panel-mount 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.glass-panel.mount-in > .glass-tint {
  animation: breath-tint calc(8s / var(--motion-speed)) ease-in-out 900ms infinite;
}
@keyframes panel-mount {
  0%   { opacity: 0; transform: scale(0.98); filter: blur(8px); }
  100% { opacity: 1; transform: scale(1); filter: blur(0); }
}
@keyframes breath-tint {
  /* Subtle opacity pulse on the tint layer reads as the panel "breathing"
     without touching its geometry. Amplitude wired to --breath-amp so the
     dev tweak panel still controls how strong it feels. */
  0%, 100% { opacity: 1; }
  50%      { opacity: calc(1 - 0.10 * var(--breath-amp)); }
}

.glass-inner {
  position: relative;
  z-index: 4;
}

/* The launching log panel constrains its height via the parent grid
   (row 1fr in .screen-launching). For the inner <ol> to actually
   overflow + scroll, the wrapping .glass-inner must propagate that
   height down + lay out as a flex column so the head stays put and
   the log fills the remaining space. Without these declarations
   .glass-inner is content-sized and its overflow:auto child never
   has a smaller-than-content viewport to scroll inside. */
.launching-log-panel > .glass-inner {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  height: 100%;
}

/* Four iridescent rim lights, one per edge, cycling async */
.glass-rim {
  position: absolute;
  z-index: 3;
  pointer-events: none;
  filter: blur(1px);
  opacity: 0.85;
}
.glass-rim-top {
  top: 0; left: 0; right: 0; height: 1.5px;
  background: linear-gradient(90deg,
    transparent, var(--accent-rose), var(--accent-lav), var(--accent-champ), var(--accent-rose), transparent);
  background-size: 240% 100%;
  animation: rim-slide calc(12s / var(--motion-speed)) linear infinite;
}
.glass-rim-right {
  top: 0; bottom: 0; right: 0; width: 1.5px;
  background: linear-gradient(180deg,
    transparent, var(--accent-champ), var(--accent-rose), var(--accent-lav), var(--accent-champ), transparent);
  background-size: 100% 240%;
  animation: rim-slide-v calc(12s / var(--motion-speed)) linear infinite;
  animation-delay: calc(-3s / var(--motion-speed));
}
.glass-rim-bottom {
  bottom: 0; left: 0; right: 0; height: 1.5px;
  background: linear-gradient(90deg,
    transparent, var(--accent-lav), var(--accent-champ), var(--accent-rose), var(--accent-lav), transparent);
  background-size: 240% 100%;
  animation: rim-slide calc(12s / var(--motion-speed)) linear infinite;
  animation-delay: calc(-6s / var(--motion-speed));
}
.glass-rim-left {
  top: 0; bottom: 0; left: 0; width: 1.5px;
  background: linear-gradient(180deg,
    transparent, var(--accent-rose), var(--accent-champ), var(--accent-lav), var(--accent-rose), transparent);
  background-size: 100% 240%;
  animation: rim-slide-v calc(12s / var(--motion-speed)) linear infinite;
  animation-delay: calc(-9s / var(--motion-speed));
}
@keyframes rim-slide   { to { background-position: 240% 0; } }
@keyframes rim-slide-v { to { background-position: 0 240%; } }

/* ═══════════════════════════════════════════════════════════════
   BREATHING TEXT
   ═══════════════════════════════════════════════════════════════ */

.bt {
  display: inline-block;
  white-space: pre-wrap;
}
.bt-g {
  display: inline-block;
  letter-spacing: 0;
  animation: bt-breath calc(8s / var(--motion-speed)) ease-in-out infinite;
  will-change: letter-spacing;
}
@keyframes bt-breath {
  0%, 100% { letter-spacing: 0em; }
  50%      { letter-spacing: 0.02em; }
}

.bt-sheen {
  background-image: linear-gradient(100deg,
    #F4E8EA 0%,
    #F4E8EA 40%,
    #FFF6F0 48%,
    #FFFFFF 50%,
    #FFF6F0 52%,
    #F4E8EA 60%,
    #F4E8EA 100%);
  background-size: 200% 100%;
  background-repeat: repeat-x;
  background-position: 100% 0;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: bt-sheen-sweep calc(4s / var(--motion-speed)) linear infinite;
}
@keyframes bt-sheen-sweep {
  0%   { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}

.bt-hover-glow .bt-g {
  transition: text-shadow 220ms cubic-bezier(0.22, 1, 0.36, 1), color 220ms cubic-bezier(0.22, 1, 0.36, 1);
}
.bt-hover-glow:hover .bt-g {
  color: #FFF0F4;
  text-shadow:
    0 0 8px rgba(229, 184, 197, 0.65),
    0 0 18px rgba(180, 116, 145, 0.35);
}
.bt-hover-glow:hover .bt-g:nth-child(2n)  { transition-delay: 30ms; }
.bt-hover-glow:hover .bt-g:nth-child(3n)  { transition-delay: 60ms; }
.bt-hover-glow:hover .bt-g:nth-child(4n)  { transition-delay: 90ms; }
.bt-hover-glow:hover .bt-g:nth-child(5n)  { transition-delay: 120ms; }

/* ═══════════════════════════════════════════════════════════════
   BUTTON
   ═══════════════════════════════════════════════════════════════ */

.vbtn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  gap: 10px;
  padding: 14px 26px;
  border: 0; outline: 0;
  background: transparent;
  color: var(--text-pearl);
  font-family: 'Newsreader', serif;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.02em;
  border-radius: 14px;
  cursor: pointer;
  overflow: hidden;
  isolation: isolate;
  transition: transform 400ms cubic-bezier(0.22, 1, 0.36, 1);
  will-change: transform;
}

.vbtn-tint {
  position: absolute; inset: 0;
  background:
    linear-gradient(135deg,
      rgba(229, 184, 197, 0.10),
      rgba(180, 116, 145, 0.06) 40%,
      rgba(201, 165, 212, 0.08) 100%);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  z-index: -2;
  border-radius: inherit;
}

.vbtn-rim {
  position: absolute; inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg,
    rgba(229, 184, 197, 0.55),
    rgba(201, 165, 212, 0.25) 50%,
    rgba(232, 212, 168, 0.45));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  z-index: -1;
  animation: vbtn-rim-pulse calc(7s / var(--motion-speed)) ease-in-out infinite;
}
@keyframes vbtn-rim-pulse {
  0%, 100% { opacity: 0.7; }
  50%      { opacity: 1; }
}

.vbtn-sheen {
  position: absolute;
  top: 0; bottom: 0;
  left: -40%; width: 40%;
  background: linear-gradient(100deg,
    transparent 30%,
    rgba(255, 240, 244, 0.18) 48%,
    rgba(229, 184, 197, 0.35) 50%,
    rgba(255, 240, 244, 0.18) 52%,
    transparent 70%);
  filter: blur(2px);
  transform: skewX(-18deg);
  z-index: -1;
  animation: vbtn-sheen-sweep calc(7s / var(--motion-speed)) linear infinite;
}
@keyframes vbtn-sheen-sweep {
  0%   { left: -40%; }
  100% { left: 110%; }
}

.vbtn:hover {
  transform: translateY(-0.5px);
}
.vbtn:hover .vbtn-sheen {
  animation-duration: calc(2.5s / var(--motion-speed));
}
.vbtn:hover .vbtn-rim {
  animation-duration: calc(2s / var(--motion-speed));
  opacity: 1;
  background: linear-gradient(135deg,
    rgba(229, 184, 197, 0.8),
    rgba(201, 165, 212, 0.45) 50%,
    rgba(232, 212, 168, 0.7));
}

.vbtn.pressing {
  transform: scale(0.96);
  transition-duration: 180ms;
}

.vbtn.primary .vbtn-tint {
  background:
    linear-gradient(135deg,
      rgba(229, 184, 197, 0.18),
      rgba(180, 116, 145, 0.14) 40%,
      rgba(201, 165, 212, 0.16) 100%);
}
.vbtn.primary {
  padding: 16px 32px;
  font-size: 17px;
}

.vbtn.disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

/* running indicator — subtle pearl comet orbiting the border */
.vbtn-running {
  position: absolute; inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background:
    conic-gradient(from 0deg,
      transparent 0deg,
      transparent 340deg,
      rgba(229, 184, 197, 0.9) 350deg,
      #FFF0F4 360deg,
      transparent 370deg);
  -webkit-mask: radial-gradient(circle, transparent 55%, #000 56%);
  animation: rim-spin 2.2s linear infinite;
  opacity: 0.8;
  filter: blur(0.5px);
}

/* press ripple */
.vbtn-ripple {
  position: absolute;
  width: 6px; height: 6px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle,
    rgba(255, 225, 230, 0.8) 0%,
    rgba(229, 184, 197, 0.4) 40%,
    transparent 70%);
  animation: vbtn-ripple 620ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  pointer-events: none;
  z-index: 2;
}
@keyframes vbtn-ripple {
  0%   { width: 6px; height: 6px; opacity: 0.9; }
  100% { width: 320px; height: 320px; opacity: 0; }
}

/* cursor pearl specks */
.vbtn-speck {
  position: absolute;
  width: 4px; height: 4px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle,
    oklch(0.95 0.08 var(--speck-hue) / 0.9) 0%,
    oklch(0.82 0.1 var(--speck-hue) / 0.4) 50%,
    transparent 80%);
  animation: vbtn-speck 700ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  pointer-events: none;
  z-index: 3;
  filter: blur(0.3px);
}
@keyframes vbtn-speck {
  0%   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -90%) scale(0.4); }
}

/* ═══════════════════════════════════════════════════════════════
   PROGRESS BAR
   ═══════════════════════════════════════════════════════════════ */

.pbar {
  position: relative;
  width: 100%;
  height: 2px;
  border-radius: 999px;
}
.pbar-track {
  position: absolute; inset: 0;
  border-radius: inherit;
  background: linear-gradient(90deg,
    rgba(229, 184, 197, 0.08),
    rgba(201, 165, 212, 0.12),
    rgba(229, 184, 197, 0.08));
  box-shadow: inset 0 0 0 1px rgba(229, 184, 197, 0.12);
}
.pbar-fill {
  position: absolute;
  top: 0; bottom: 0; left: 0;
  border-radius: inherit;
  background: linear-gradient(90deg,
    #D4A8B8 0%,
    #E5B8C5 30%,
    #F4D4DE 50%,
    #E5B8C5 70%,
    #C9A5D4 100%);
  transition: width 400ms cubic-bezier(0.22, 1, 0.36, 1), background 600ms cubic-bezier(0.22, 1, 0.36, 1);
  overflow: visible;
}
.pbar-flow {
  position: absolute; inset: 0;
  border-radius: inherit;
  background:
    linear-gradient(90deg,
      transparent 0%,
      rgba(255, 240, 244, 0.35) 30%,
      rgba(255, 255, 255, 0.55) 50%,
      rgba(255, 240, 244, 0.35) 70%,
      transparent 100%);
  background-size: 40% 100%;
  background-repeat: no-repeat;
  animation: pbar-flow calc(3s / var(--motion-speed)) linear infinite;
  mix-blend-mode: screen;
}
@keyframes pbar-flow {
  0%   { background-position: -40% 0; }
  100% { background-position: 140% 0; }
}
.pbar-bloom {
  position: absolute;
  top: -4px; bottom: -4px;
  right: -6px;
  width: 14px;
  background: radial-gradient(ellipse at center,
    rgba(255, 230, 238, 0.9) 0%,
    rgba(229, 184, 197, 0.4) 40%,
    transparent 80%);
  filter: blur(3px);
  pointer-events: none;
}

/* Complete state */
.pbar-state-complete .pbar-fill {
  background: linear-gradient(90deg,
    #E5B8C5 0%, #F4D4DE 40%, #E8D4A8 80%, #E5B8C5 100%);
  box-shadow: 0 0 12px rgba(229, 184, 197, 0.45);
}
.pbar-ring {
  position: absolute;
  left: 100%;
  top: 50%;
  width: 4px; height: 4px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(229, 184, 197, 0.8);
  animation: pbar-ring 1400ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  pointer-events: none;
}
@keyframes pbar-ring {
  0%   { width: 4px;   height: 4px;   opacity: 0.9; border-width: 2px; }
  100% { width: 320px; height: 320px; opacity: 0;   border-width: 1px; }
}

/* Error state — variants */
.pbar-state-error.pbar-err-rose .pbar-fill {
  background: linear-gradient(90deg,
    #A35A6C 0%, #C96A7A 50%, #D4889A 100%);
  box-shadow: 0 0 8px rgba(201, 106, 122, 0.4);
}
.pbar-state-error.pbar-err-rose .pbar-flow {
  opacity: 0.35;
  animation-duration: calc(8s / var(--motion-speed));
}

.pbar-state-error.pbar-err-recede .pbar-fill {
  animation: pbar-recede 1200ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes pbar-recede {
  to { width: 0; }
}
.pbar-state-error.pbar-err-recede .pbar-track {
  background: linear-gradient(90deg,
    rgba(201, 106, 122, 0.15),
    rgba(229, 184, 197, 0.1),
    rgba(201, 106, 122, 0.15));
}
.pbar-err-shimmer {
  position: absolute; inset: 0;
  border-radius: inherit;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(201, 106, 122, 0.5) 48%,
    rgba(244, 232, 234, 0.6) 50%,
    rgba(201, 106, 122, 0.5) 52%,
    transparent 100%);
  background-size: 30% 100%;
  background-repeat: no-repeat;
  animation: pbar-err-shim 1400ms cubic-bezier(0.22, 1, 0.36, 1) infinite;
  mix-blend-mode: screen;
}
@keyframes pbar-err-shim {
  0%   { background-position: -30% 0; opacity: 0; }
  20%  { opacity: 1; }
  100% { background-position: 130% 0; opacity: 0; }
}

.pbar-state-error.pbar-err-fracture .pbar-fill {
  background: linear-gradient(90deg,
    #C8A4B4 0%, #B47491 50%, #8A6E7E 100%);
  filter: saturate(0.8);
}
.pbar-fracture {
  position: absolute;
  top: -6px; bottom: -6px;
  width: 1px;
  transform: translateX(-50%);
  background: linear-gradient(180deg,
    transparent,
    #E5B8C5 20%,
    #F4D4DE 50%,
    #C9A5D4 80%,
    transparent);
  filter: blur(0.5px);
  box-shadow: 0 0 6px rgba(229, 184, 197, 0.8);
  animation: pbar-frac-shim 2s ease-in-out infinite;
}
@keyframes pbar-frac-shim {
  0%, 100% { opacity: 0.6; transform: translateX(-50%) scaleY(1); }
  50%      { opacity: 1;   transform: translateX(-50%) scaleY(1.08); }
}

/* Celebrating state — all progress bars brighten */
.app-window.celebrating .pbar-state-complete .pbar-fill {
  filter: brightness(1.2);
}

/* ═══════════════════════════════════════════════════════════════
   SLIDER
   ═══════════════════════════════════════════════════════════════ */

.vslider {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.vslider-label {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-mauve);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 400;
}
.vslider-row {
  position: relative;
  padding: 12px 6px;
}
.vslider-track {
  position: relative;
  width: 100%; height: 2px;
  border-radius: 999px;
  background: linear-gradient(90deg,
    rgba(229, 184, 197, 0.1),
    rgba(201, 165, 212, 0.15),
    rgba(229, 184, 197, 0.1));
  cursor: pointer;
}
.vslider-fill {
  position: absolute; top: 0; bottom: 0; left: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, #D4A8B8, #E5B8C5 50%, #C9A5D4);
  overflow: visible;
}
.vslider-handle {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 14px; height: 14px;
  pointer-events: none;
}
.vslider-halo {
  position: absolute; inset: -10px;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(255, 230, 238, 0.55) 0%,
    rgba(229, 184, 197, 0.2) 40%,
    transparent 75%);
  filter: blur(4px);
  animation: firefly calc(3s / var(--motion-speed)) ease-in-out infinite;
}
@keyframes firefly {
  0%, 100% { opacity: 0.65; transform: scale(1); }
  50%      { opacity: 1;    transform: scale(1.15); }
}
.vslider-core {
  position: absolute; inset: 3px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%,
    #FFF0F4 0%, #E5B8C5 50%, #B47491 100%);
  box-shadow:
    0 0 6px rgba(229, 184, 197, 0.9),
    inset 0 0 0 0.5px rgba(255, 255, 255, 0.4);
}
.vslider-trail {
  position: absolute; top: 50%;
  transform: translate(-50%, -50%);
  width: 4px; height: 4px;
  border-radius: 50%;
  background: radial-gradient(circle, #FFF0F4, transparent 70%);
  animation: vslider-trail 500ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  pointer-events: none;
}
@keyframes vslider-trail {
  to { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
}
.vslider-value {
  position: absolute;
  bottom: calc(100% + 4px);
  transform: translateX(-50%);
  font-family: 'JetBrains Mono', monospace;

.inst-row > :not(.inst-row-hit) { position: relative; z-index: 1; pointer-events: none; }
.inst-row-delete { pointer-events: auto; }
.inst-row-mark {
  grid-row: 1 / 3;
  width: 4px;
  background: transparent;
  border-radius: 2px;
  transition: background 240ms;
}
.inst-row-active .inst-row-mark {
  background: linear-gradient(180deg, #E5B8C5, #C9A5D4);
  box-shadow: 0 0 10px rgba(229, 184, 197, 0.6);
}
.inst-row-name {
  grid-column: 2 / 4; grid-row: 1;
  font-family: var(--display-font, 'Fraunces'), serif;
  font-size: 18px;
  font-weight: 300;
  color: #F4E8EA;
  letter-spacing: -0.005em;
}
.inst-row-active .inst-row-name { color: #FFF6F0; }
.inst-row-meta {
  grid-column: 2; grid-row: 2;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: #9A8087;
  text-transform: uppercase;
  align-self: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.inst-row-last {
  grid-column: 3; grid-row: 2;
  justify-self: end;
  font-family: var(--body-font, 'Newsreader'), serif;
  font-style: italic;
  font-size: 11px;
  color: #6B555C;
  letter-spacing: 0;
  align-self: center;
  white-space: nowrap;
}
.inst-row-delete {
  grid-column: 4; grid-row: 1 / 3;
  align-self: center;
  justify-self: end;
  margin-left: 12px;
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 1px solid rgba(229, 184, 197, 0.18);
  background: transparent;
  color: #9A8087;
  font-size: 11px;
  line-height: 1;
  cursor: pointer;
  opacity: 0;
  transform: translateX(-4px);
  transition: opacity 240ms cubic-bezier(0.22, 1, 0.36, 1),
              transform 240ms cubic-bezier(0.22, 1, 0.36, 1),
              border-color 240ms, color 240ms, box-shadow 240ms;
  pointer-events: none;
}
.inst-row:hover .inst-row-delete {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
}
.inst-row-delete:hover {
  border-color: rgba(201, 106, 122, 0.6);
  color: #D4889A;
  box-shadow: 0 0 10px rgba(201, 106, 122, 0.25);
}

.inst-detail {
  padding: 28px 44px;
  overflow-y: auto;
  min-height: 0;
}
.inst-detail-panel { width: 100%; }

.inst-detail-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  padding-bottom: 24px;
  border-bottom: 1px solid rgba(229, 184, 197, 0.08);
  margin-bottom: 28px;
}
.inst-detail-head .vbtn { white-space: nowrap; flex-shrink: 0; }
.inst-detail-eyebrow {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: 0.3em;
  color: #9A8087;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.inst-detail-name {
  font-family: var(--display-font, 'Fraunces'), serif;
  font-size: 36px;
  font-weight: 300;
  letter-spacing: -0.015em;
  color: #F4E8EA;
  margin: 0 0 8px;
  line-height: 1;
  white-space: nowrap;
}
.inst-detail-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: #C4AFB5;
  text-transform: uppercase;
}
.dot-sep {
  display: inline-block;
  width: 3px; height: 3px;
  border-radius: 50%;
  background: rgba(229, 184, 197, 0.4);
}

.inst-config {
  display: flex;
  flex-direction: column;
  gap: 22px;
  padding-bottom: 28px;
  border-bottom: 1px solid rgba(229, 184, 197, 0.08);
  margin-bottom: 28px;
}
.inst-config-row {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.inst-config-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--body-font, 'Newsreader'), serif;
  font-style: italic;
  font-size: 14px;
  color: #C4AFB5;
}
.inst-config-value {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  color: #E5B8C5;
  text-transform: uppercase;
}

.inst-mods-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
}
.inst-mods-title {
  font-family: var(--display-font, 'Fraunces'), serif;
  font-size: 18px;
  font-weight: 300;
  color: #F4E8EA;
}
.inst-mods-count {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: #9A8087;
  text-transform: uppercase;
}
.inst-mods-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
}
.mod-row {
  display: grid;
  grid-template-columns: 28px 1fr auto auto;
  gap: 14px;
  align-items: center;
  padding: 12px 0;
  border-top: 1px solid rgba(229, 184, 197, 0.06);
  transition: opacity 300ms;
}
@keyframes mod-row-in {
  from { opacity: 0.4; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.mod-row:first-child { border-top: 0; }
.mod-row-off { opacity: 0.4; }

.mod-toggle {
  width: 22px; height: 22px;
  background: transparent;
  border: 1px solid rgba(229, 184, 197, 0.2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  transition: border-color 240ms;
}
.mod-toggle:hover { border-color: #E5B8C5; }
.mod-pearl {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: transparent;
  transition: all 320ms cubic-bezier(0.22, 1, 0.36, 1);
}
.mod-pearl-on {
  background: radial-gradient(circle, #FFF6F0 0%, #E5B8C5 70%, #C9A5D4 100%);
  box-shadow: 0 0 8px rgba(229, 184, 197, 0.7);
}
.mod-name {
  font-family: var(--display-font, 'Fraunces'), serif;
  font-size: 15px;
  font-weight: 400;
  color: #F4E8EA;
}
.mod-cat {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 9px;
  letter-spacing: 0.18em;
  color: #9A8087;
  text-transform: uppercase;
}
.mod-version {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 11px;
  color: #C4AFB5;
}

.inst-mods-empty {
  font-family: var(--body-font, 'Newsreader'), serif;
  font-style: italic;
  font-size: 14px;
  color: #6B555C;
  text-align: center;
  padding: 32px 0;
}

/* ════════════════════════════════════════════════════════════════
   LAUNCHING SCREEN
   ════════════════════════════════════════════════════════════════ */
.screen-launching {
  position: relative;
  flex: 1;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 0;
  min-height: 0;
  padding: 0;
}

.screen-head-launching {
  align-items: flex-start;
  padding: 36px 48px 28px;
  border-bottom: 1px solid rgba(229, 184, 197, 0.08);
}
.launching-eyebrow {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: 0.35em;
  color: #E5B8C5;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.launching-name {
  font-family: var(--display-font, 'Fraunces'), serif;
  font-size: 56px;
  font-weight: 300;
  letter-spacing: -0.025em;
  color: #F4E8EA;
  margin: 0 0 10px;
  line-height: 1;
}
.launching-meta {
  display: flex;
  gap: 12px;
  align-items: center;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: #C4AFB5;
  text-transform: uppercase;
}
.launching-percent {
  display: flex;
  align-items: baseline;
  gap: 4px;
  font-family: var(--display-font, 'Fraunces'), serif;
  color: #F4E8EA;
}
.launching-percent-num {
  font-size: 80px;
  font-weight: 300;
  line-height: 1;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
}
.launching-percent-pct {
  font-size: 24px;
  color: #9A8087;
  margin-left: 2px;
}

.launching-progress-region {
  padding: 28px 48px;
  border-bottom: 1px solid rgba(229, 184, 197, 0.08);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.launching-stage {
  font-family: var(--body-font, 'Newsreader'), serif;
  font-style: italic;
  font-size: 18px;
  color: #C4AFB5;
  letter-spacing: 0.02em;
}

.launching-log-panel {
  margin: 28px 48px 8px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.launching-log-head {
  display: flex;
  justify-content: space-between;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(229, 184, 197, 0.08);
  margin-bottom: 12px;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  color: #9A8087;
  text-transform: uppercase;
}
.launching-log-title { color: #E5B8C5; }

.launching-log {
  list-style: none;
  margin: 0;
  padding: 0;
  flex: 1;
  overflow-y: auto;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 11.5px;
  line-height: 1.85;
  scroll-behavior: smooth;
  mask-image: linear-gradient(180deg, transparent 0%, #000 8%, #000 100%);
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 8%, #000 100%);
}
.log-line {
  display: grid;
  grid-template-columns: 56px 88px 1fr;
  gap: 14px;
  padding: 1px 4px;
  border-radius: 2px;
}
@keyframes log-line-in {
  from { opacity: 0.4; transform: translateX(-4px); filter: blur(2px); }
  to   { opacity: 1; transform: translateX(0);    filter: blur(0); }
}
.log-time { color: #6B555C; font-variant-numeric: tabular-nums; text-align: right; }
.log-src  { color: #9A8087; }
.log-msg  { color: #C4AFB5; }
.log-info .log-src { color: #B47491; }
.log-warn .log-src { color: #E8D4A8; }
.log-warn .log-msg { color: #E8D4A8; }
.log-ok   .log-src { color: #C9A5D4; }
.log-ok   .log-msg { color: #F4E8EA; }
.log-ok            { background: rgba(201, 165, 212, 0.06); }
.log-dim .log-msg  { color: #6B555C; font-style: italic; font-family: var(--body-font, 'Newsreader'), serif; font-size: 12px; letter-spacing: 0; }
.log-dim .log-time, .log-dim .log-src { opacity: 0.5; }

.launching-footer {
  padding: 18px 48px 32px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 60px;
}
.launching-cancel {
  background: transparent;
  border: 0;
  font-family: var(--body-font, 'Newsreader'), serif;
  font-style: italic;
  font-size: 14px;
  color: #9A8087;
  cursor: pointer;
  letter-spacing: 0.05em;
  transition: color 240ms;
}
.launching-cancel:hover { color: #E5B8C5; }
.launching-handoff {
  font-family: var(--display-font, 'Fraunces'), serif;
  font-size: 22px;
  font-weight: 300;
  font-style: italic;
  color: #F4E8EA;
  letter-spacing: 0.02em;
}

/* ════════════════════════════════════════════════════════════════
   QUIT OVERLAY
   ════════════════════════════════════════════════════════════════ */
.app-window.quitting .screen-stage,
.app-window.quitting .backdrop { animation: dim-out 1200ms cubic-bezier(0.22, 1, 0.36, 1) both; }
@keyframes dim-out {
  to { opacity: 0.2; filter: blur(8px); }
}
.quit-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
  pointer-events: none;
}
.quit-line {
  font-family: var(--display-font, 'Fraunces'), serif;
  font-size: 32px;
  font-style: italic;
  font-weight: 300;
  color: #F4E8EA;
  letter-spacing: 0.02em;
  animation: quit-fade 1200ms cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes quit-fade {
  0%   { opacity: 0; transform: translateY(8px); }
  30%  { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-4px); }
}

/* ════════════════════════════════════════════════════════════════
   STATE PICKER REPURPOSED AS SCREEN PICKER (already styled)
   ════════════════════════════════════════════════════════════════ */
.state-picker { z-index: 12; }


/* Failsafes — animations may not register their final state in some hosts */
.screen-stage, .menu-item, .mod-row, .log-line { opacity: 1; }


/* ════════════════════════════════════════════════════════════════
   INSTANCES — empty state
   ════════════════════════════════════════════════════════════════ */
.inst-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 60px;
}
.inst-empty-mark {
  font-family: var(--display-font, 'Fraunces'), serif;
  font-size: 36px;
  font-weight: 300;
  font-style: italic;
  letter-spacing: -0.01em;
  color: #C4AFB5;
}
.inst-empty-sub {
  font-family: var(--body-font, 'Newsreader'), serif;
  font-style: italic;
  font-size: 16px;
  color: #6B555C;
  letter-spacing: 0.04em;
}
.inst-empty-add {
  margin-top: 24px;
  padding: 12px 28px;
  background: transparent;
  border: 1px solid rgba(229, 184, 197, 0.22);
  border-radius: 999px;
  color: #F4E8EA;
  font-family: var(--display-font, 'Fraunces'), serif;
  font-size: 16px;
  font-weight: 300;

  cursor: pointer;
  transition: border-color 240ms, box-shadow 240ms, background 240ms;

.inst-empty-add:hover {

/* ════════════════════════════════════════════════════════════════
   SETTINGS
   ════════════════════════════════════════════════════════════════ */
.screen-settings {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.settings-body {
  flex: 1;
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 36px;
  padding: 8px 60px 48px;
  min-height: 0;
}
.settings-tabs {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-top: 16px;
}
.settings-tabs-title {
  font-family: var(--display-font, 'Fraunces'), serif;
  font-size: 32px;
  font-weight: 300;
  letter-spacing: -0.01em;
  color: #F4E8EA;
  margin-bottom: 28px;
  padding-left: 14px;
}
.settings-tab {
  position: relative;
  display: grid;
  grid-template-columns: 4px 1fr;
  gap: 14px;
  padding: 14px 14px 14px 0;
  background: transparent;
  border: 0;
  text-align: left;
  cursor: pointer;
  color: inherit;
  font-family: inherit;
  transition: padding-left 320ms cubic-bezier(0.22, 1, 0.36, 1);
}
.settings-tab:hover { padding-left: 8px; }
.settings-tab-mark {
  width: 4px;
  height: 18px;
  align-self: center;
  background: transparent;
  border-radius: 2px;
  transition: background 240ms, box-shadow 240ms;
}
.settings-tab-active .settings-tab-mark {
  background: linear-gradient(180deg, #E5B8C5, #C9A5D4);
  box-shadow: 0 0 10px rgba(229, 184, 197, 0.6);
}
.settings-tab-label {
  font-family: var(--display-font, 'Fraunces'), serif;
  font-size: 18px;
  font-weight: 300;
  color: #9A8087;
  letter-spacing: -0.005em;
}
.settings-tab-active .settings-tab-label { color: #F4E8EA; }

.settings-detail {
  min-height: 0;
  overflow-y: auto;
  padding-top: 16px;
  padding-right: 8px;
}
.settings-panel { width: 100%; }
.settings-section {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.settings-section-head {
  margin-bottom: 28px;
  padding-bottom: 18px;
  border-bottom: 1px solid rgba(229, 184, 197, 0.08);
}
.settings-h {
  margin: 0 0 6px;
  font-family: var(--display-font, 'Fraunces'), serif;
  font-size: 32px;
  font-weight: 300;
  letter-spacing: -0.015em;
  color: #F4E8EA;
}
.settings-subhead {
  font-family: var(--body-font, 'Newsreader'), serif;
  font-style: italic;
  font-size: 14px;
  letter-spacing: 0.02em;
  color: #9A8087;
}
.settings-row {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 28px;
  align-items: center;
  padding: 18px 0;
  border-bottom: 1px solid rgba(229, 184, 197, 0.05);
}
.settings-row:last-child { border-bottom: 0; }
.settings-row-stack {
  grid-template-columns: 1fr;
  align-items: stretch;
  gap: 12px;
}
.settings-label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-family: var(--display-font, 'Fraunces'), serif;
  font-size: 16px;
  font-weight: 300;
  font-style: italic;
  color: #F4E8EA;
}
.settings-hint {
  font-family: var(--body-font, 'Newsreader'), serif;
  font-style: italic;
  font-size: 12px;
  letter-spacing: 0.02em;
  color: #6B555C;
}

/* Toggle */
.settings-toggle {
  position: relative;
  width: 44px;
  height: 22px;
  border-radius: 999px;
  background: rgba(229, 184, 197, 0.08);
  border: 1px solid rgba(229, 184, 197, 0.18);
  cursor: pointer;
  justify-self: end;
  transition: background 320ms, border-color 320ms, box-shadow 320ms;
  padding: 0;
}
.settings-toggle.on {
  background: rgba(229, 184, 197, 0.22);
  border-color: rgba(229, 184, 197, 0.45);
  box-shadow: 0 0 14px rgba(229, 184, 197, 0.28);
}
.settings-toggle:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.settings-toggle-pearl {
  position: absolute;
  left: 2px; top: 50%;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #FFF6F0, #E5B8C5 60%, #C8A4B4);
  transform: translateY(-50%);
  transition: left 320ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 320ms;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
}
.settings-toggle.on .settings-toggle-pearl {
  left: calc(100% - 18px);
  box-shadow: 0 0 10px rgba(255, 246, 240, 0.7), 0 1px 4px rgba(0, 0, 0, 0.3);
}

/* Path field */
.settings-pathfield {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
}
.settings-pathinput {
  background: rgba(229, 184, 197, 0.04);
  border: 1px solid rgba(229, 184, 197, 0.14);
  border-radius: 8px;
  padding: 10px 14px;
  color: #F4E8EA;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 12px;
  letter-spacing: 0.02em;
  outline: none;
  transition: border-color 240ms, box-shadow 240ms;
}
.settings-pathinput:focus {
  border-color: rgba(229, 184, 197, 0.45);
  box-shadow: 0 0 0 3px rgba(229, 184, 197, 0.08);
}
.settings-pathbtn {
  background: transparent;
  border: 1px solid rgba(229, 184, 197, 0.18);
  border-radius: 8px;
  padding: 10px 18px;
  color: #C4AFB5;
  font-family: var(--display-font, 'Fraunces'), serif;
  font-size: 13px;
  font-style: italic;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: border-color 240ms, color 240ms, box-shadow 240ms;
}
.settings-pathbtn:hover {
  border-color: #E5B8C5;
  color: #F4E8EA;
  box-shadow: 0 0 14px rgba(229, 184, 197, 0.2);
}

.settings-danger {
  align-self: start;
  background: transparent;
  border: 1px solid rgba(201, 106, 122, 0.3);
  border-radius: 999px;
  padding: 10px 22px;
  color: #D4889A;
  font-family: var(--display-font, 'Fraunces'), serif;
  font-style: italic;
  font-size: 14px;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: border-color 240ms, color 240ms, box-shadow 240ms;
}
.settings-danger:hover {
  border-color: rgba(201, 106, 122, 0.7);
  color: #E5B0BD;
  box-shadow: 0 0 16px rgba(201, 106, 122, 0.2);
}


/* ════════════════════════════════════════════════════════════════
   Inline rename — instance detail name field
   ════════════════════════════════════════════════════════════════ */
.inst-detail-name {
  position: relative;
  cursor: text;
}
.inst-detail-rename {
  margin-left: 12px;
  background: transparent;
  border: 0;
  color: rgba(229, 184, 197, 0.4);
  font-size: 14px;
  cursor: pointer;
  padding: 0 6px;

.modal-shroud {
  position: absolute;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center,
    rgba(8, 2, 6, 0.55) 0%,
    rgba(8, 2, 6, 0.85) 100%);
  /* 8px → 4px: the dim gradient already separates modal foreground from
     background; the 8px blur was adding unreadability without separation
     value. Lighter blur keeps the boudoir feel without obliterating the
     scene for the duration of the modal. */
  backdrop-filter: blur(4px) saturate(0.85);
  -webkit-backdrop-filter: blur(4px) saturate(0.85);
  animation: modal-shroud-in 160ms cubic-bezier(0.22, 1, 0.36, 1) both;
  padding: 40px;
}
@keyframes modal-shroud-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.modal-card {
  position: relative;
  width: min(560px, 100%);
  max-height: calc(100% - 60px);
  border-radius: 22px;
  overflow: visible;
  isolation: isolate;
  /* Card open: 480 → 240ms. The 480ms duration combined with a 10px blur-in
     filter that resolves during the same window made the modal feel "still
     loading" for the user; 240ms keeps the silken curve readable while
     halving the perceived delay. The blur start value is also reduced
     (10 → 6) so by the 50% mark the text is already legible. */
  animation: modal-card-in 240ms cubic-bezier(0.22, 1, 0.36, 1) both;
  box-shadow:
    0 32px 80px rgba(0, 0, 0, 0.55),
    0 8px 28px rgba(0, 0, 0, 0.4),
    0 0 60px rgba(180, 116, 145, 0.12),
    inset 0 0 0 0.5px rgba(229, 184, 197, 0.18);
}
@keyframes modal-card-in {
  /* No filter:blur — translate + scale + opacity is enough motion for the
     entrance, and a CSS filter forces every glyph inside the card to be
     re-rasterized through the blur for the entire animation duration,
     which read as "the modal is still loading" for ~150ms after click. */
  from { opacity: 0; transform: translateY(10px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0)    scale(1);    }
}
.modal-glass-refract {
  position: absolute; inset: 0;
  border-radius: inherit;
  backdrop-filter: blur(40px) saturate(1.5);
  -webkit-backdrop-filter: blur(40px) saturate(1.5);
  background: linear-gradient(180deg,
    rgba(38, 18, 30, 0.92) 0%,
    rgba(28, 12, 22, 0.95) 100%);
  z-index: 0;
}
.modal-glass-tint {
  position: absolute; inset: 0;
  border-radius: inherit;
  background:

      rgba(180, 116, 145, 0.06) 40%,
      rgba(201, 165, 212, 0.10) 100%),
    radial-gradient(140% 80% at 50% -20%, rgba(244, 232, 234, 0.14), transparent 60%);

  pointer-events: none;
}

}
.modal-head {

}

.modal-title {

}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((key, val) => {
    setValues((prev) => ({ ...prev, [key]: val }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});
</script>
<script type="text/babel">// Backdrop: velvet folds, pearl dust, bokeh orb, falling petals, settled rose-dust.
// Every surface moves. Nothing here is static. All primitives here also feed the component layer.

const { useEffect, useRef, useState } = React;

// Silk easing used everywhere
const SILK = 'cubic-bezier(0.22, 1, 0.36, 1)';

// ——————————————————————————————————————————————————————————————
// Velvet folds — slow-drifting soft-warped gradients reading as fabric catching light.
// Implemented as layered radial blobs with long-period transforms + a subtle turbulence via SVG feTurbulence
// Looks like silk; distorts slightly over 16-20s loops.
// ——————————————————————————————————————————————————————————————
function VelvetFolds({ speed = 1, warmth = 0.6 }) {
  // warmth 0..1 shifts the hue toward berry (0) vs champagne (1)
  const hueA = 345 - warmth * 20; // berry -> rose
  const hueB = 320 - warmth * 30; // plum -> mauve
  const hueC = 35 + warmth * 10;  // dim champagne
  return (
    <div className="vf-root" aria-hidden>
      <svg className="vf-turb" xmlns="http://www.w3.org/2000/svg">
        <defs>
          {/* Static turbulence (no <animate> on baseFrequency) so the GPU
              can cache the displacement-map output. The radial gradients
              still drift via CSS transforms (fold-drift), which is what
              produces the silky-fold motion — animating the noise field
              itself was a per-frame full-rasterize cost for negligible
              additional movement. Displacement scale dropped 60 → 28
              for the same reason; folds still read as fabric. */}
          <filter id="vfTurb" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.007 0.011" numOctaves="2" seed="4" />
            <feDisplacementMap in="SourceGraphic" scale="28" />
          </filter>
        </defs>
      </svg>
      <div className="vf-layer vf-a" style={{
        background: `radial-gradient(60% 50% at 30% 40%, oklch(0.26 0.08 ${hueA} / 0.9), transparent 70%)`,
        animationDuration: `${22 / speed}s`,
      }} />
      <div className="vf-layer vf-b" style={{
        background: `radial-gradient(55% 55% at 75% 65%, oklch(0.22 0.09 ${hueB} / 0.85), transparent 70%)`,
        animationDuration: `${28 / speed}s`,
      }} />
      <div className="vf-layer vf-c" style={{
        background: `radial-gradient(40% 50% at 60% 20%, oklch(0.28 0.05 ${hueC} / 0.55), transparent 70%)`,
        animationDuration: `${34 / speed}s`,
      }} />
      <div className="vf-vignette" />
    </div>
  );
}

// ——————————————————————————————————————————————————————————————
// Pearl dust motes — canvas-driven so we can run hundreds cheaply.
// Dust drifts upward with slight horizontal sway; occasionally a mote catches light and brightens.
// Settled dust accumulates at the bottom; clicking disturbs it.
// ——————————————————————————————————————————————————————————————
function PearlDust({ density = 1, speed = 1, disturbKey = 0 }) {
  const canvasRef = useRef(null);
  const rafRef = useRef(0);
  const moteStateRef = useRef({ airborne: [], settled: [], disturb: 0 });

  useEffect(() => {
    const cv = canvasRef.current;
    if (!cv) return;
    const ctx = cv.getContext('2d');
    let width = 0, height = 0;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    const resize = () => {
      width = cv.clientWidth;
      height = cv.clientHeight;
      cv.width = width * dpr;
      cv.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(cv);

    const AIR_COUNT = Math.floor(90 * density);
    const SETTLED_COUNT = Math.floor(60 * density);

    const makeAir = () => ({
      x: Math.random() * width,
      y: height + Math.random() * 80,
      vy: -(0.08 + Math.random() * 0.18) * speed,
      vx: (Math.random() - 0.5) * 0.04,
      r: 0.3 + Math.random() * 1.4,
      life: 0,
      maxLife: 400 + Math.random() * 600,
      shinePhase: Math.random() * Math.PI * 2,
      shineFreq: 0.003 + Math.random() * 0.004,
    });
    const makeSettled = () => ({
      x: Math.random() * width,
      y: height - 6 - Math.random() * 28,
      r: 0.5 + Math.random() * 1.2,
      twinkle: Math.random() * Math.PI * 2,
    });

    moteStateRef.current.airborne = Array.from({ length: AIR_COUNT }, makeAir);
    moteStateRef.current.settled = Array.from({ length: SETTLED_COUNT }, makeSettled);

    const loop = () => {
      ctx.clearRect(0, 0, width, height);

      const state = moteStateRef.current;

      // settled first (behind)
      for (const s of state.settled) {
        s.twinkle += 0.02;
        const glow = 0.35 + Math.sin(s.twinkle) * 0.15;
        const disturbPush = state.disturb > 0 ? state.disturb * 18 * (Math.random() - 0.5) : 0;
        const ry = state.disturb > 0 ? s.y - state.disturb * 12 : s.y;
        ctx.fillStyle = `rgba(244, 232, 234, ${0.08 + glow * 0.1})`;
        ctx.beginPath();
        ctx.arc(s.x + disturbPush, ry, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // airborne
      for (const m of state.airborne) {
        m.x += m.vx + Math.sin(m.life * 0.01) * 0.12;
        m.y += m.vy;
        m.life += 1;
        m.shinePhase += m.shineFreq;

        if (m.y < -10 || m.life > m.maxLife) {
          Object.assign(m, makeAir());
          m.y = height + 5;
        }

        const shine = (Math.sin(m.shinePhase) + 1) / 2; // 0..1
        const alpha = 0.18 + shine * 0.5;
        const r = m.r * (1 + shine * 0.8);

        // soft glow layer
        const grd = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, r * 4);
        grd.addColorStop(0, `rgba(244, 232, 234, ${alpha * 0.6})`);
        grd.addColorStop(0.4, `rgba(229, 184, 197, ${alpha * 0.2})`);
        grd.addColorStop(1, 'rgba(229, 184, 197, 0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(m.x, m.y, r * 4, 0, Math.PI * 2);
        ctx.fill();

        // core
        ctx.fillStyle = `rgba(250, 240, 242, ${alpha})`;
        ctx.beginPath();
        ctx.arc(m.x, m.y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      state.disturb *= 0.93;
      if (state.disturb < 0.01) state.disturb = 0;

      rafRef.current = requestAnimationFrame(loop);
    };
    loop();

    return () => {
      cancelAnimationFrame(rafRef.current);
      ro.disconnect();
    };
  }, [density, speed]);

  useEffect(() => {
    if (disturbKey > 0) {
      moteStateRef.current.disturb = 1;
    }
  }, [disturbKey]);

  return <canvas ref={canvasRef} className="pearl-dust" aria-hidden />;
}

// ——————————————————————————————————————————————————————————————
// Bokeh orb — one massively-blurred soft pearl that crosses every ~60s.
// ——————————————————————————————————————————————————————————————
function BokehOrb({ speed = 1, tintIndex = 0 }) {
  // tintIndex 0 = pearl-pink (berry), 1 = champagne, 2 = lavender, 3 = opal
  const tints = [
    { inner: '#E5B8C5', mid: '#B47491' },
    { inner: '#E8D4A8', mid: '#C9A888' },
    { inner: '#C9A5D4', mid: '#8A6E9E' },
    { inner: '#F4E8EA', mid: '#C9A5D4' },
  ];
  const t = tints[tintIndex] || tints[0];
  return (
    <div
      className="bokeh-orb"
      aria-hidden
      style={{
        background: `radial-gradient(circle, ${t.inner} 0%, ${t.mid}33 55%, transparent 78%)`,
        animationDuration: `${60 / speed}s`,
      }}
    />
  );
}

// ——————————————————————————————————————————————————————————————
// Falling petals — rare, intentional. Becomes a wave during hero moment.
// ——————————————————————————————————————————————————————————————
function Petals({ density = 1, celebrate = false }) {
  const canvasRef = useRef(null);
  const rafRef = useRef(0);
  const petalsRef = useRef([]);
  const celebrateRef = useRef(false);

  useEffect(() => { celebrateRef.current = celebrate; }, [celebrate]);

  useEffect(() => {
    const cv = canvasRef.current;
    const ctx = cv.getContext('2d');
    let width = 0, height = 0;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const resize = () => {
      width = cv.clientWidth; height = cv.clientHeight;
      cv.width = width * dpr; cv.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    const ro = new ResizeObserver(resize); ro.observe(cv);

    const makePetal = (burst = false) => ({
      x: burst ? -40 + Math.random() * width * 0.4 : Math.random() * width,
      y: burst ? -40 - Math.random() * 200 : -30 - Math.random() * height,
      vx: burst ? 0.4 + Math.random() * 0.6 : (Math.random() - 0.5) * 0.15,
      vy: burst ? 0.35 + Math.random() * 0.4 : 0.18 + Math.random() * 0.3,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.02,
      size: 6 + Math.random() * 10,
      hue: 340 + Math.random() * 30,
      alpha: 0.35 + Math.random() * 0.45,
      flutter: Math.random() * Math.PI * 2,
    });

    const BASE = Math.floor(4 * density);
    petalsRef.current = Array.from({ length: BASE }, () => makePetal(false));

    let lastBurst = 0;
    const loop = (t) => {
      ctx.clearRect(0, 0, width, height);

      if (celebrateRef.current && t - lastBurst > 30) {
        lastBurst = t;
        if (petalsRef.current.length < 140) {
          petalsRef.current.push(makePetal(true));
        }
      }

      for (let i = petalsRef.current.length - 1; i >= 0; i--) {
        const p = petalsRef.current[i];
        p.flutter += 0.03;
        p.x += p.vx + Math.sin(p.flutter) * 0.4;
        p.y += p.vy;
        p.rot += p.vrot;
        if (p.y > height + 30 || p.x > width + 30) {
          if (celebrateRef.current) { petalsRef.current.splice(i, 1); continue; }
          Object.assign(p, makePetal(false));
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        const grd = ctx.createLinearGradient(-p.size, 0, p.size, 0);
        grd.addColorStop(0, `oklch(0.75 0.09 ${p.hue} / ${p.alpha})`);
        grd.addColorStop(0.5, `oklch(0.82 0.10 ${p.hue + 10} / ${p.alpha})`);
        grd.addColorStop(1, `oklch(0.68 0.08 ${p.hue - 10} / ${p.alpha * 0.6})`);
        ctx.fillStyle = grd;
        ctx.beginPath();
        // teardrop petal
        ctx.moveTo(0, -p.size);
        ctx.bezierCurveTo(p.size * 0.9, -p.size * 0.6, p.size * 0.6, p.size * 0.6, 0, p.size);
        ctx.bezierCurveTo(-p.size * 0.6, p.size * 0.6, -p.size * 0.9, -p.size * 0.6, 0, -p.size);
        ctx.fill();
        ctx.restore();
      }

      // Keep a small baseline of petals when not celebrating
      if (!celebrateRef.current && petalsRef.current.length < BASE) {
        petalsRef.current.push(makePetal(false));
      }

      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);

    return () => { cancelAnimationFrame(rafRef.current); ro.disconnect(); };
  }, [density]);

  return <canvas ref={canvasRef} className="petals" aria-hidden />;
}

// ——————————————————————————————————————————————————————————————
// Iridescent caustics — slow-drifting overlay that reads as light on water/silk.
// ——————————————————————————————————————————————————————————————
function Caustics({ intensity = 0.5, speed = 1 }) {
  return (
    <div className="caustics" aria-hidden style={{ opacity: intensity }}>
      <div className="caustics-layer" style={{ animationDuration: `${38 / speed}s` }} />
      <div className="caustics-layer caustics-layer-b" style={{ animationDuration: `${52 / speed}s` }} />
    </div>
  );
}

// ——————————————————————————————————————————————————————————————
// Backdrop root — composes all ambient layers.
// ——————————————————————————————————————————————————————————————
function Backdrop({ density, speed, warmth, bokehTint, celebrate, onDisturb, disturbKey }) {
  return (
    <div
      className="backdrop"
      onClick={onDisturb}
    >
      <VelvetFolds speed={speed} warmth={warmth} />
      <Caustics intensity={0.45 * density} speed={speed} />
      <BokehOrb speed={speed} tintIndex={bokehTint} />
      <Petals density={density} celebrate={celebrate} />
      <PearlDust density={density} speed={speed} disturbKey={disturbKey} />
    </div>
  );
}

Object.assign(window, { Backdrop, SILK });
</script>
<script type="text/babel">// Components: Panel, Button, BreathingText, ProgressBar, Slider, Dropdown, StatusLine.
// Every resting state has motion — sheen sweeps, rim cycles, breathing.

const { useEffect, useRef, useState, useMemo, useCallback } = React;

// ——————————————————————————————————————————————————————————————
// Glass Panel — real backdrop-filter refraction, pearlescent rim cycling per edge.
// Materializes on mount: opacity + scale + blur resolve over 800ms (Silk).
// ——————————————————————————————————————————————————————————————
function Panel({ children, className = '', breathing = true, breathAmp = 1, motionSpeed = 1, style = {} }) {
  const [mounted, setMounted] = useState(false);
  useEffect(() => {
    const id = setTimeout(() => setMounted(true), 20);
    return () => clearTimeout(id);
  }, []);
  return (
    <div
      className={`glass-panel ${mounted ? 'mounted' : ''} ${breathing ? 'breathing' : ''} ${className}`}
      style={{
        '--breath-amp': breathAmp,
        '--motion-speed': motionSpeed,
        ...style,
      }}
    >
      <div className="glass-refract" aria-hidden />
      <div className="glass-tint" aria-hidden />
      <div className="glass-rim glass-rim-top" aria-hidden />
      <div className="glass-rim glass-rim-right" aria-hidden />
      <div className="glass-rim glass-rim-bottom" aria-hidden />
      <div className="glass-rim glass-rim-left" aria-hidden />
      <div className="glass-inner">{children}</div>
    </div>
  );
}

// ——————————————————————————————————————————————————————————————
// Breathing text — per-letter tracking breath, optional sheen, optional per-glyph hover glow.
// State changes animate letter-by-letter.
// ——————————————————————————————————————————————————————————————
function BreathingText({
  children,
  className = '',
  as: Tag = 'span',
  sheen = false,
  hoverGlow = false,
  style = {},
  staggerIn = false,
}) {
  const text = typeof children === 'string' ? children : String(children ?? '');
  const prevText = useRef(text);
  const [animKey, setAnimKey] = useState(0);

  useEffect(() => {
    if (prevText.current !== text) {
      prevText.current = text;
      setAnimKey(k => k + 1);
    }
  }, [text]);

  const letters = useMemo(() => {
    return text.split('').map((ch, i) => ({ ch, i }));
  }, [text, animKey]);

  return (
    <Tag
      className={`bt ${sheen ? 'bt-sheen' : ''} ${hoverGlow ? 'bt-hover-glow' : ''} ${className}`}
      style={style}
      key={animKey}
    >
      {letters.map(({ ch, i }) => (
        <span
          key={i}
          className="bt-g"
          style={{
            '--i': i,
            '--stagger-delay': staggerIn ? `${i * 35}ms` : '0ms',
          }}
        >
          {ch === ' ' ? '\u00A0' : ch}
        </span>
      ))}
    </Tag>
  );
}

// ——————————————————————————————————————————————————————————————
// Button — glass material, denser. Velvet sheen sweeps every 6-8s.
// Hover: sheen speeds up, cursor gains pearl-speck trail, rim pulses.
// Press: folds inward to 0.96, emits pink ripple. Release: spring-back.
// ——————————————————————————————————————————————————————————————
function Button({ children, onClick, running = false, disabled = false, className = '', primary = false }) {
  const btnRef = useRef(null);
  const [pressing, setPressing] = useState(false);
  const [ripples, setRipples] = useState([]);
  const [specks, setSpecks] = useState([]);
  const speckIdRef = useRef(0);
  const lastSpeckRef = useRef(0);

  const onPointerDown = (e) => {
    if (disabled) return;
    setPressing(true);
    const rect = btnRef.current.getBoundingClientRect();
    const rx = e.clientX - rect.left;
    const ry = e.clientY - rect.top;
    const id = Date.now() + Math.random();
    setRipples(r => [...r, { id, x: rx, y: ry }]);
    setTimeout(() => setRipples(r => r.filter(x => x.id !== id)), 650);
  };
  const onPointerUp = () => setPressing(false);
  const onPointerLeave = () => setPressing(false);

  const onPointerMove = (e) => {
    if (disabled) return;
    const now = performance.now();
    if (now - lastSpeckRef.current < 40) return;
    lastSpeckRef.current = now;
    const rect = btnRef.current.getBoundingClientRect();
    const rx = e.clientX - rect.left;
    const ry = e.clientY - rect.top;
    const id = ++speckIdRef.current;
    const hue = 340 + Math.random() * 30;
    setSpecks(s => [...s.slice(-8), { id, x: rx, y: ry, hue }]);
    setTimeout(() => setSpecks(s => s.filter(x => x.id !== id)), 700);
  };

  return (
    <button
      ref={btnRef}
      className={`vbtn ${pressing ? 'pressing' : ''} ${running ? 'running' : ''} ${primary ? 'primary' : ''} ${disabled ? 'disabled' : ''} ${className}`}
      onPointerDown={onPointerDown}
      onPointerUp={onPointerUp}
      onPointerLeave={onPointerLeave}
      onPointerMove={onPointerMove}
      onClick={onClick}
      disabled={disabled}
      type="button"
    >
      <span className="vbtn-tint" aria-hidden />
      <span className="vbtn-sheen" aria-hidden />
      <span className="vbtn-rim" aria-hidden />
      <span className="vbtn-label">
        <BreathingText hoverGlow>{children}</BreathingText>
      </span>
