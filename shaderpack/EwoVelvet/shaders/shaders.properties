# EwoVelvet — the EwoClient house shaderpack (Velvet & Pearl identity).
# v0: post-processing core only (tonemap + grade + vignette + dither).
# Iris's built-in gbuffers render the world; `final` owns the image.

# Options screen layout (Iris shader pack settings UI).
screen=SHADOWS SHADOW_SOFTNESS SHADOW_DARKNESS shadowMapResolution <empty> VOLUMETRIC_LIGHT VL_STRENGTH VL_STEPS <empty> WATER_WAVES WATER_FOAM WATER_SSR SSR_STRENGTH <empty> VELVET_SKY VELVET_FOG FOG_DISTANCE <empty> EXPOSURE TONEMAP_ACES VELVET_GRADE VIGNETTE_STRENGTH <empty> BLOOM BLOOM_STRENGTH BLOOM_THRESHOLD BLOOM_RADIUS

# 26.x Iris translucency: translucent programs no longer blend into the
# scene buffer (the "colorwheel" pipeline resolves vanilla translucency
# separately, ignoring the pack's colortex0 output — this cost us a whole
# evening). The working-pack pattern: accumulate translucent color into a
# dedicated buffer with per-buffer premultiplied blending, then composite
# it over the scene manually (composite1 does ours).
blend.gbuffers_water = off
blend.gbuffers_water.colortex5 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# Which options render as sliders rather than toggles/cycles.
sliders=EXPOSURE VELVET_GRADE VIGNETTE_STRENGTH BLOOM_STRENGTH BLOOM_THRESHOLD BLOOM_RADIUS SHADOW_SOFTNESS SHADOW_DARKNESS VL_STRENGTH SSR_STRENGTH FOG_DISTANCE
