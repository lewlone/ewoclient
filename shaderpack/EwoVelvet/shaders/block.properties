# Block-ID mapping (Iris feeds these through the mc_Entity vertex
# attribute). 10001 = water in all its forms — the water treatment in
# gbuffers_water keys off this instead of face orientation, so side
# faces at shore steps and slanted flowing-water surfaces are included
# (they used to fall through to vanilla transparent alpha).
block.10001 = minecraft:water minecraft:bubble_column

# Submerged-only plants — these can ONLY exist inside water, so any pixel
# of them with no water fragment in front is a waterline rasterization
# seam (composite1 paints it as grazing water). Unbounded range, exact.
block.10002 = minecraft:kelp minecraft:kelp_plant minecraft:seagrass minecraft:tall_seagrass
