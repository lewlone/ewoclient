# Build + unit tests on every push and PR.
#
# What this covers: everything `cargo test` can check without the local 26.2
# game assets. Tests that need the decompile / client jar skip on a runner, and
# the `rewo *shot --check` gates (which also need a Vulkan device) are not run
# here — run `python tools/gates.py` locally for those.
#
# Jobs:
#   test      the gates-feature build, tests and clippy (-D warnings), plus the
#             pvp-feature half of ewo-core / ewo-jni the default build never compiles
#   fmt       cargo fmt --check (rustfmt.toml pins LF, so run it on Linux)
#   linux     cargo check of the launcher's renderer on Linux, so the glutin/GL
#             backend (never built by the Windows jobs) at least compiles
#   shipped   the configuration package.ps1 actually ships (default features);
#             `test` only ever built with --features rewo-app/gates
#   msrv      the declared rust-version (workspace Cargo.toml), not floating stable
#   audit     RustSec advisories against Cargo.lock
name: ci

# Least privilege: nothing here writes to the repo, issues or checks.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # rewo-gpu's build.rs compiles its GLSL with glslc from the Vulkan SDK.
      # Pinned to the SDK the owner builds with locally (VULKAN_SDK=C:/VulkanSDK/1.3.296.0)
      # so CI compiles the shaders with the same glslc.
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.296.0
          install_runtime: false
          cache: true
          stripdown: true

      - name: Build
        run: cargo build --workspace --all-targets --features rewo-app/gates

      - name: Test
        run: cargo test --workspace --no-fail-fast --features rewo-app/gates

      # The in-game mod's assist modules live behind `pvp`, which no default
      # or workspace build turns on, so its Rust half (the extra REGISTRY
      # slots in ewo-core and the cdylib that exposes them) was never compiled
      # or tested in CI.
      - name: Check ewo-jni (pvp)
        run: cargo check -p ewo-jni --features pvp

      - name: Test ewo-core (pvp)
        run: cargo test -p ewo-core --features pvp

      # Warnings fail the build: the workspace reached zero on 2026-10-14, and
      # an advisory-only clippy step is how 186 of them had piled up. Lints
      # that would distort a vanilla transcription are allowed in the
      # workspace [lints] table or at the item, with a reason.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features rewo-app/gates,ewo-jni/fixture -- -D warnings

      - name: Clippy (pvp)
        run: cargo clippy -p ewo-jni -p ewo-core --all-targets --features ewo-jni/pvp,ewo-core/pvp,ewo-jni/fixture -- -D warnings

      # rewo-app's `audio` feature (the cpal backend, soundshot's decode and
      # mixer layers) is off in every other build here, so a lint in code only
      # it compiles went unseen until 2026-10-14.
      - name: Clippy + test (audio)
        run: |
          cargo clippy -p rewo-audio -p rewo-app --all-targets --features rewo-app/gates,rewo-app/audio -- -D warnings
          cargo test -p rewo-app --features rewo-app/gates,rewo-app/audio

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: rustfmt
        run: cargo fmt --all --check

  # The Windows jobs compile the D3D12 + DirectComposition backend only; the
  # Linux/Hyprland path (Skia GL on glutin, gl_backend.rs `glutin_backend`) and
  # every cfg(not(windows)) branch were never built by anything. This type-checks
  # them. It runs `check`, not `build`: linking Skia needs a display stack the
  # runner does not have, and compiling is the thing that rots.
  linux:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux

      # skia-bindings downloads a prebuilt Skia (gl + textlayout) for
      # x86_64-unknown-linux-gnu; fontconfig/EGL/GL/Wayland/xkbcommon are what
      # its link line and the winit/glutin stack name.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             pkg-config libfontconfig1-dev libegl1-mesa-dev libgl1-mesa-dev             libwayland-dev libxkbcommon-dev libx11-dev

      # The workspace enables skia-safe's `d3d` feature for the Windows
      # backend. skia-bindings publishes no Linux binary with it, and its
      # bindings need the Windows SDK, so drop it for this job only.
      - name: Use the Linux Skia feature set
        run: |
          sed -i 's/, "d3d"//' Cargo.toml
          grep -n '^skia-safe' Cargo.toml
          if grep -q '^skia-safe.*d3d' Cargo.toml; then echo "d3d still enabled"; exit 1; fi

      # No --locked here: the step above edits Cargo.toml, which changes the
      # resolved graph (the d3d feature's Windows-only deps drop out), so the
      # lockfile must be allowed to follow for this job. Every other job
      # builds the committed Cargo.lock unchanged.
      - name: Check ewo-render
        run: cargo check -p ewo-render --all-targets

      # Required since its first green run (2026-10-14, run 38588657010).
      - name: Check ewo-launcher
        run: cargo check -p ewo-launcher

  # Build exactly what package.ps1 ships: default features, no `gates`.
  # rewo-app's gates feature pulls in render_check, the witness blocks and the
  # REWO_* test knobs, so a break that only exists without it (a cfg'd-out
  # import, a default-only code path) was invisible to the job above.
  shipped:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: shipped

      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.296.0
          install_runtime: false
          cache: true
          stripdown: true

      - name: Build rewo (default features)
        run: cargo build -p rewo-app

      - name: Build launcher
        run: cargo build -p ewo-launcher

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The workspace declares rust-version = "1.89" but CI only ever ran stable.
  # rust-toolchain.toml says `stable`, which would override the action's
  # default toolchain, so RUSTUP_TOOLCHAIN pins the whole job.
  msrv:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: "1.89"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.89

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.296.0
          install_runtime: false
          cache: true
          stripdown: true

      - name: Check (MSRV)
        run: cargo check --workspace --all-targets --features rewo-app/gates

  # Known-vulnerable dependencies. Reads Cargo.lock only, so any runner works.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: audit

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit
