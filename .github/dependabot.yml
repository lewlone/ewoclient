# Weekly update PRs for Cargo dependencies and the workflow actions.
# cargo audit (ci.yml) catches known advisories; this keeps the lockfile and
# the pinned action versions from drifting far enough that an upgrade becomes
# a project. Grouped so a week's bumps arrive as one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The windows-rs crates (windows, windows-core, windows-implement, ...)
      # must move together: ewo-jni names `windows-core` beside `windows`,
      # and PR #6 bumped the core alone to 0.100, linking two cores (the
      # `#[implement]` COM handlers stop satisfying the traits) and needing
      # rustc 1.95 over the 1.89 MSRV. On 0.x a minor bump is a breaking
      # one, so those wait for a deliberate upgrade with the MSRV decided.
      - dependency-name: "windows*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The ref of dtolnay/rust-toolchain IS the toolchain: `@1.89` is the MSRV
      # job's pin (workspace rust-version), not an outdated action version.
      # Dependabot "bumped" it to @1.120 in PR #4, which turned the MSRV
      # check into a check against Rust 1.120.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
