# Weekly update PRs for Cargo dependencies and the workflow actions.
# cargo audit (ci.yml) catches known advisories; this keeps the lockfile and
# the pinned action versions from drifting far enough that an upgrade becomes
# a project. Grouped so a week's bumps arrive as one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The ref of dtolnay/rust-toolchain IS the toolchain: `@1.89` is the MSRV
      # job's pin (workspace rust-version), not an outdated action version.
      # Dependabot "bumped" it to @1.120 in PR #4, which turned the MSRV
      # check into a check against Rust 1.120.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
